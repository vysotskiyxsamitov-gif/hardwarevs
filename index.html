<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Главная</title>

    <!-- Применяем сохранённую тему ДО отрисовки страницы, чтобы не было мигания -->
    <script>
        try {
            var savedTheme = localStorage.getItem('hardwarevs-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        } catch (e) {}
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="auth.js"></script>
    <script src="cookies.js"></script>

    <style>
        /* ТЕМЫ: все цвета вынесены в переменные */
        :root, :root[data-theme="dark"] {
            --bg: #06020b;
            --text: #ffffff;
            --glow-1: rgba(168, 85, 247, 0.18);
            --glow-2: rgba(6, 182, 212, 0.12);
            --panel-bg: rgba(19, 13, 51, 0.92);
            --panel-border: #442a7a;
            --panel-text: #e9d5ff;
            --panel-muted: #9aa0a6;
            --option-bg: #24194f;
            --h1-shadow: rgba(168, 85, 247, 0.4);
            color-scheme: dark;
        }
        :root[data-theme="light"] {
            --bg: #f3f0fa;
            --text: #1b1233;
            --glow-1: rgba(168, 85, 247, 0.28);
            --glow-2: rgba(6, 182, 212, 0.22);
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: #d4c4f2;
            --panel-text: #2a1a5e;
            --panel-muted: #6b6485;
            --option-bg: #ece6fa;
            --h1-shadow: rgba(109, 40, 217, 0.18);
            color-scheme: light;
        }

        /* Полный сброс и фон */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); font-family: 'Segoe UI', sans-serif;
            color: var(--text); overflow-x: hidden; user-select: none;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        body { overflow-y: auto; }

        /* Задний неоновый свет на фоне */
        .bg-glow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .bg-glow { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, var(--glow-1) 0%, rgba(0,0,0,0) 70%); top: 15%; left: 15%; border-radius: 50%; filter: blur(50px); animation: floatGlow 8s infinite alternate ease-in-out; }
        .bg-glow-2 { position: absolute; width: 350px; height: 350px; background: radial-gradient(circle, var(--glow-2) 0%, rgba(0,0,0,0) 70%); bottom: 15%; right: 15%; border-radius: 50%; filter: blur(60px); animation: floatGlow 12s infinite alternate-reverse ease-in-out; }
        @keyframes floatGlow { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 20px) scale(1.1); } }

        /* Выравнивание интерфейса строго по центру */
        .main-wrapper {
            position: relative; z-index: 10; width: 100%; min-height: 100%;
            display: flex; justify-content: center; align-items: center; pointer-events: none;
            /* Плавное появление страницы */
            animation: pageIn 0.6s ease backwards;
            transition: opacity 0.45s ease, transform 0.45s ease, filter 0.45s ease;
        }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); filter: blur(6px); }
        }
        /* Плавный уход со страницы при нажатии на кнопку */
        html.leaving .main-wrapper { opacity: 0; transform: scale(0.96) translateY(-8px); filter: blur(8px); }
        html.leaving .settings, html.leaving .reviews-btn { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }

        .main-container { text-align: center; width: 90%; max-width: 380px; pointer-events: auto; padding: 20px 0; }

        /* Переливающийся неоновый заголовок */
        h1 {
            font-size: 46px; font-weight: 900; margin-top: 0; margin-bottom: 35px; letter-spacing: 2px;
            background: linear-gradient(90deg, #a855f7, #06b6d4, #f59e0b, #a855f7); background-size: 300% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: textShine 6s linear infinite;
            filter: drop-shadow(0 0 15px var(--h1-shadow));
        }
        @keyframes textShine { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

        /* Вертикальный блок кнопок */
        .buttons-stack { display: flex; flex-direction: column; gap: 16px; width: 100%; }

        .btn-style {
            display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; color: #ffffff;
            text-decoration: none; padding: 16px 0; border-radius: 10px; font-weight: bold; font-size: 15px;
            letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255, 255, 255, 0.08); box-sizing: border-box; position: relative; overflow: hidden;
        }
        .btn-style::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transition: all 0.5s ease; }
        .btn-style:hover::after { left: 100%; }
        .btn-style:active { transform: translateY(0) scale(0.98); }
        .btn-style:focus-visible { outline: 2px solid #a855f7; outline-offset: 3px; }

        /* Стили геймерских градиентов */
        .btn-purple { background: linear-gradient(135deg, #a855f7 0%, #6d28d9 100%); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25); }
        .btn-purple:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6); border-color: rgba(168, 85, 247, 0.5); }

        .btn-gold { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(245, 158, 11, 0.7); border-color: rgba(245, 158, 11, 0.5); }

        .btn-guide { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25); }
        .btn-guide:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(6, 182, 212, 0.6); border-color: rgba(6, 182, 212, 0.5); }

        /* Кнопка «Построить компьютер» */
        .btn-build { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); box-shadow: 0 4px 15px rgba(236, 72, 153, 0.25); }
        .btn-build:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6); border-color: rgba(236, 72, 153, 0.5); }

        .btn-style i { font-style: normal; transition: transform 0.3s ease; }
        .btn-style:hover i { transform: scale(1.2); }

        /* ШЕСТЕРЕНКА И ОКНО НАСТРОЕК */
        .settings { position: fixed; top: 20px; right: 20px; z-index: 50; transition: opacity 0.3s ease; }

        .gear-btn {
            width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center;
            background: var(--panel-bg); color: var(--panel-text);
            border: 1px solid var(--panel-border); border-radius: 50%; cursor: pointer;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.4s, color 0.4s;
        }
        .gear-btn svg { width: 22px; height: 22px; transition: transform 0.6s ease; }
        .gear-btn:hover { border-color: #a855f7; box-shadow: 0 0 14px rgba(168, 85, 247, 0.4); }
        .gear-btn:hover svg { transform: rotate(60deg); }
        .gear-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
        .gear-btn:focus-visible { outline: 2px solid #a855f7; outline-offset: 3px; }

        /* КНОПКА «ОТЗЫВЫ» — слева от шестерёнки (20px отступ + 44px шестерёнка + 10px зазор) */
        .reviews-btn {
            position: fixed; top: 20px; right: 74px; z-index: 50;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            background: var(--panel-bg); color: #f59e0b; text-decoration: none; font-size: 22px; line-height: 1;
            border: 1px solid var(--panel-border); border-radius: 50%;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.4s, opacity 0.3s ease;
        }
        .reviews-btn:hover { border-color: #f59e0b; box-shadow: 0 0 14px rgba(245, 158, 11, 0.5); }
        .reviews-btn:focus-visible { outline: 2px solid #a855f7; outline-offset: 3px; }

        /* КНОПКА «ПРЕДЛОЖИТЬ» — слева от кнопки отзывов */
        .suggest-btn {
            position: fixed; top: 20px; right: 128px; z-index: 50;
            width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center;
            background: var(--panel-bg); color: #06b6d4; font-size: 22px; line-height: 1; cursor: pointer;
            border: 1px solid var(--panel-border); border-radius: 50%;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.4s, opacity 0.3s ease;
        }
        .suggest-btn:hover { border-color: #06b6d4; box-shadow: 0 0 14px rgba(6, 182, 212, 0.5); }
        .suggest-btn:focus-visible { outline: 2px solid #a855f7; outline-offset: 3px; }
        html.leaving .suggest-btn { opacity: 0; pointer-events: none; }

        /* СОЦСЕТИ: плашка с двумя логотипами по центру внизу */
        .social-bar {
            position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50;
            display: flex; align-items: center; gap: 10px; padding: 6px;
            background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 30px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.3s ease, background-color 0.4s, border-color 0.4s;
        }
        html.leaving .social-bar { opacity: 0; pointer-events: none; }
        .social-link {
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; color: #ffffff; text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .social-link svg { width: 22px; height: 22px; fill: currentColor; }
        .social-tg { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3); }
        .social-tg:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.7); }
        .social-tt { background: linear-gradient(135deg, #111111 0%, #2a2a2a 100%); box-shadow: 0 2px 10px rgba(236, 72, 153, 0.3); }
        .social-tt svg { filter: drop-shadow(1.5px 1.5px 0 #ff0050) drop-shadow(-1.5px -1.5px 0 #00f2ea); }
        .social-tt:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.7); }
        .social-link:focus-visible { outline: 2px solid #a855f7; outline-offset: 3px; }

        /* ОКНО ПРЕДЛОЖЕНИЯ */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px;
            background: rgba(6, 2, 11, 0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal {
            width: 100%; max-width: 380px; padding: 20px; box-sizing: border-box;
            background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; color: var(--panel-text);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); transform: translateY(10px) scale(0.97); transition: transform 0.25s ease;
        }
        .modal-overlay.open .modal { transform: none; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { margin: 0; font-size: 18px; }
        .modal-close { background: none; border: 0; padding: 4px 8px; font-size: 24px; line-height: 1; color: var(--panel-muted); cursor: pointer; }
        .modal-close:hover { color: #a855f7; }
        .modal-label { margin: 0 0 8px; font-size: 13px; color: var(--panel-muted); }
        .kind-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
        .kind-option {
            padding: 11px 0; background: var(--option-bg); color: var(--panel-text);
            border: 1px solid transparent; border-radius: 6px; cursor: pointer;
            font-family: inherit; font-size: 13px; font-weight: 600;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .kind-option:hover { border-color: #a855f7; }
        .kind-option[aria-pressed="true"] {
            background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%);
            border-color: #a855f7; color: #fff; box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }
        .modal-input {
            width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px;
            background: var(--option-bg); color: var(--panel-text); border: 1px solid var(--panel-border);
            font: inherit; user-select: text; -webkit-user-select: text;
        }
        .modal-hint { margin: 6px 0 0; font-size: 12px; color: var(--panel-muted); }
        .modal-send {
            width: 100%; margin-top: 16px; padding: 12px 0; border: 0; border-radius: 8px; cursor: pointer;
            background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; font-weight: 700; font-size: 14px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        .modal-send:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-msg { margin-top: 10px; min-height: 18px; font-size: 13px; }
        .modal-msg.err { color: #f87171; }
        .modal-msg.ok { color: #4ade80; }
        .modal-need-login { text-align: center; line-height: 1.7; }
        .modal-need-login a { color: #a855f7; font-weight: 600; }
        .kind-option:focus-visible, .modal-input:focus-visible, .modal-send:focus-visible, .modal-close:focus-visible { outline: 2px solid #a855f7; outline-offset: 2px; }

        /* МАГАЗИН: VIP под блоком аккаунта */
        .shop {
            position: fixed; top: 72px; left: 20px; z-index: 50; display: flex; align-items: center; gap: 8px;
            max-width: calc(100% - 40px); min-height: 40px; padding: 0 6px 0 14px; box-sizing: border-box;
            background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 20px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; color: var(--panel-text);
            transition: opacity 0.3s ease;
        }
        .shop[hidden] { display: none; }
        html.leaving .shop { opacity: 0; pointer-events: none; }
        .shop-vip { font-weight: 700; white-space: nowrap; }
        .shop-status { color: var(--panel-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .shop-info { flex: none; width: 26px; height: 26px; padding: 0; border-radius: 50%; cursor: pointer; font: inherit; font-weight: 700;
            background: var(--option-bg); color: var(--panel-text); border: 1px solid var(--panel-border); }
        .shop-info:hover { border-color: #a855f7; }
        .shop-buy { flex: none; border: 0; border-radius: 14px; padding: 7px 12px; cursor: pointer; font: inherit; font-weight: 700; color: #fff; white-space: nowrap;
            background: linear-gradient(135deg, #f59e0b, #b45309); }
        .shop-info:focus-visible, .shop-buy:focus-visible { outline: 2px solid #a855f7; outline-offset: 2px; }
        .modal-list { margin: 0 0 12px; padding-left: 20px; line-height: 1.7; }
        .modal-text { margin: 0 0 8px; line-height: 1.5; }

        /* Телефоны: кнопки чуть меньше, чтобы все три поместились рядом с аккаунтом */
        @media (max-width: 480px) {
            .gear-btn, .reviews-btn, .suggest-btn { width: 40px; height: 40px; }
            .settings { top: 16px; right: 16px; }
            .reviews-btn { top: 16px; right: 64px; }
            .suggest-btn { top: 16px; right: 112px; }
            .shop { top: 64px; left: 16px; max-width: calc(100% - 32px); }
            .account { top: 16px; left: 16px; min-height: 40px; max-width: calc(100% - 175px); }
            .social-bar { bottom: 16px; }
            .social-link { width: 40px; height: 40px; }
        }

        .settings-panel {
            position: absolute; top: 54px; right: 0; width: 220px; padding: 14px;
            background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            opacity: 0; visibility: hidden; transform: translateY(-8px) scale(0.97); transform-origin: top right;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        }
        .settings-panel.open { opacity: 1; visibility: visible; transform: none; }

        .settings-title {
            font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--panel-muted); margin-bottom: 10px;
        }
        .theme-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .theme-option {
            display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 0;
            background: var(--option-bg); color: var(--panel-text);
            border: 1px solid transparent; border-radius: 6px; cursor: pointer;
            font-family: inherit; font-size: 13px; font-weight: 600;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, color 0.2s;
        }
        .theme-option:hover { border-color: #a855f7; }
        .theme-option[aria-pressed="true"] {
            background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%);
            border-color: #a855f7; color: #fff; box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }
        .theme-option:focus-visible { outline: 2px solid #a855f7; outline-offset: 2px; }


        /* АККАУНТ (слева сверху) — справа оставляем место под две круглые кнопки */
        .account { position: fixed; top: 20px; left: 20px; z-index: 50; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 214px);
            min-height: 44px; padding: 0 14px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 22px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; transition: opacity .3s ease; }
        .account:empty { display: none; }
        .acc-mail { color: var(--panel-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .acc-link { background: none; border: 0; padding: 4px 2px; cursor: pointer; font: inherit; font-weight: 600; color: var(--panel-text); text-decoration: none; white-space: nowrap; }
        .acc-link:hover { color: #a855f7; }
        .acc-link:focus-visible { outline: 2px solid #a855f7; outline-offset: 2px; border-radius: 4px; }
        .acc-link + .acc-link { margin-left: 4px; padding-left: 10px; border-left: 1px solid var(--panel-border); }
        html.leaving .account { opacity: 0; pointer-events: none; }

        /* ЭЛЕМЕНТЫ МЯГКОГО НЕОНОВОГО ШЛЕЙФА */
        .magic-dot {
            position: fixed; width: 6px; height: 6px; background-color: #a855f7; border-radius: 50%;
            pointer-events: none; z-index: 5; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
            animation: fadeOutDot 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes fadeOutDot {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
        }

        /* Уважаем настройку «уменьшить анимацию» в системе */
        @media (prefers-reduced-motion: reduce) {
            .main-wrapper, .bg-glow, .bg-glow-2, h1 { animation: none; }
            .main-wrapper, .settings-panel, .gear-btn svg { transition: none; }
        }
    </style>
</head>
<body>

<div class="bg-glow-container">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
</div>

<!-- Вход / регистрация / профиль -->
<div class="account" id="account"></div>

<!-- Магазин: VIP-статус под аккаунтом -->
<div class="shop" id="shop">
    <span class="shop-vip">👑 VIP</span>
    <span class="shop-status" id="shop-status">…</span>
    <button class="shop-info" id="shop-info" type="button" aria-label="Что даёт VIP" title="Что даёт VIP">?</button>
    <button class="shop-buy" id="shop-buy" type="button">Купить · 75 🍪</button>
</div>

<div class="modal-overlay" id="shop-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="shop-title">
        <div class="modal-head">
            <h2 class="modal-title" id="shop-title"></h2>
            <button class="modal-close" id="shop-close" type="button" aria-label="Закрыть">×</button>
        </div>
        <div id="shop-body"></div>
    </div>
</div>

<!-- Отзывы: слева от шестерёнки -->
<a class="reviews-btn" href="https://vysotskiyxsamitov-gif.github.io/hardwarevs/reviews.html" aria-label="Отзывы" title="Отзывы">⭐</a>

<!-- Предложить добавить процессор или видеокарту: слева от кнопки отзывов -->
<button class="suggest-btn" id="suggest-btn" type="button" aria-label="Предложить добавить" aria-haspopup="dialog" title="Предложить добавить">💡</button>

<div class="modal-overlay" id="suggest-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="suggest-title">
        <div class="modal-head">
            <h2 class="modal-title" id="suggest-title">Предложить добавить</h2>
            <button class="modal-close" id="suggest-close" type="button" aria-label="Закрыть">×</button>
        </div>
        <div id="suggest-body"></div>
    </div>
</div>

<div class="main-wrapper">
    <div class="main-container">
        <h1>HardwareVS</h1>

        <div class="buttons-stack">
            <a href="https://vysotskiyxsamitov-gif.github.io/hardwarevs/builder.html" class="btn-style btn-build"><i>🛠️</i> Построить компьютер</a>
            <a href="https://vysotskiyxsamitov-gif.github.io/hardwarevs/cpu.html" class="btn-style btn-purple"><i>💻</i> Сравнить процессоры</a>
            <a href="https://vysotskiyxsamitov-gif.github.io/hardwarevs/gpu.html" class="btn-style btn-gold"><i>🎮</i> Сравнить видеокарты</a>
            <a href="https://vysotskiyxsamitov-gif.github.io/hardwarevs/guide.html" class="btn-style btn-guide"><i>📖</i> Пошаговый Гайд</a>

<script>
(function () {
    const root = document.documentElement;
    if (window.HW_AUTH) window.HW_AUTH.mountAccount(document.getElementById('account'));
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- ТЕМА ---------- */
    const THEME_KEY = 'hardwarevs-theme';
    const themeButtons = document.querySelectorAll('.theme-option');

    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        themeButtons.forEach(function (btn) {
            btn.setAttribute('aria-pressed', btn.dataset.themeValue === theme ? 'true' : 'false');
        });
    }
    function saveTheme(theme) {
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }

    applyTheme(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

    themeButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            applyTheme(btn.dataset.themeValue);
            saveTheme(btn.dataset.themeValue);
        });
    });

    /* ---------- ОКНО НАСТРОЕК ---------- */
    const gearBtn = document.getElementById('gear-btn');
    const panel = document.getElementById('settings-panel');
    const settings = document.getElementById('settings');

    function setPanel(open) {
        panel.classList.toggle('open', open);
        gearBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    gearBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setPanel(!panel.classList.contains('open'));
    });
    // Закрытие по клику вне окна и по Escape
    document.addEventListener('click', function (e) {
        if (!settings.contains(e.target)) setPanel(false);
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { setPanel(false); gearBtn.focus(); }
    });

    /* ---------- ПРЕДЛОЖЕНИЕ: что добавить на сайт ---------- */
    const sugBtn = document.getElementById('suggest-btn');
    const sugOverlay = document.getElementById('suggest-overlay');
    const sugBody = document.getElementById('suggest-body');
    const SUG_HINTS = {
        cpu: 'Например: Ryzen 7 7800X3D',
        gpu: 'Например: GeForce RTX 4070 Super'
    };

    function sugMsg(text, type) {
        const el = document.getElementById('suggest-msg');
        if (el) { el.textContent = text; el.className = 'modal-msg ' + (type || ''); }
    }

    async function renderSuggest() {
        if (!window.HW_AUTH) {
            sugBody.textContent = 'Сервис временно недоступен. Попробуйте позже.';
            return;
        }
        const user = await window.HW_AUTH.getUser();

        if (!user) {
            sugBody.innerHTML = '<div class="modal-need-login">🔒 Чтобы отправить предложение, нужно войти в аккаунт.<br>' +
                '<a href="login.html?next=index.html">Войти</a> · <a href="register.html?next=index.html">Регистрация</a></div>';
            return;
        }

        sugBody.innerHTML =
            '<p class="modal-label">Что вы хотите добавить?</p>' +
            '<div class="kind-switch">' +
                '<button class="kind-option" type="button" data-kind="cpu" aria-pressed="false">💻 Процессор</button>' +
                '<button class="kind-option" type="button" data-kind="gpu" aria-pressed="false">🎮 Видеокарта</button>' +
            '</div>' +
            '<p class="modal-label">Точное название</p>' +
            '<input class="modal-input" id="suggest-name" type="text" maxlength="100" autocomplete="off" placeholder="Сначала выберите, что добавить">' +
            '<p class="modal-hint">Пишите полное название вместе с серией, как на коробке или в магазине.</p>' +
            '<button class="modal-send" id="suggest-send" type="button">Отправить предложение</button>' +
            '<div class="modal-msg" id="suggest-msg" role="status"></div>';

        let kind = '';
        const input = document.getElementById('suggest-name');
        const send = document.getElementById('suggest-send');
        const options = sugBody.querySelectorAll('.kind-option');

        options.forEach(function (btn) {
            btn.addEventListener('click', function () {
                kind = btn.dataset.kind;
                options.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
                input.placeholder = SUG_HINTS[kind];
                input.focus();
            });
        });

        async function submit() {
            const name = input.value.replace(/\s+/g, ' ').trim();
            if (!kind) return sugMsg('Выберите: процессор или видеокарта.', 'err');
            if (name.length < 2) return sugMsg('Введите точное название.', 'err');

            send.disabled = true;
            sugMsg('Отправляю…');
            const res = await window.HW_AUTH.client.from('suggestions').insert({ user_id: user.id, kind: kind, name: name });
            send.disabled = false;

            if (res.error) {
                sugMsg(res.error.code === '23505' ? 'Вы уже предлагали это.' : 'Ошибка: ' + res.error.message, 'err');
                return;
            }
            input.value = '';
            sugMsg('Спасибо! Предложение отправлено.', 'ok');
        }
        send.addEventListener('click', submit);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    }

    function openSuggest() {
        setPanel(false);
        sugOverlay.classList.add('open');
        renderSuggest();
    }
    function closeSuggest() {
        if (!sugOverlay.classList.contains('open')) return;
        sugOverlay.classList.remove('open');
        sugBtn.focus();
    }
    sugBtn.addEventListener('click', function (e) { e.stopPropagation(); openSuggest(); });
    document.getElementById('suggest-close').addEventListener('click', closeSuggest);
    sugOverlay.addEventListener('click', function (e) { if (e.target === sugOverlay) closeSuggest(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSuggest(); });

    /* ---------- МАГАЗИН: VIP за печеньки ---------- */
    const C = window.HW_COOKIES;
    const shop = document.getElementById('shop');
    const shopOverlay = document.getElementById('shop-overlay');
    const shopBody = document.getElementById('shop-body');
    let shopMode = 'info', shopTrigger = null;

    function vipPrice(w) { return (w && w.vip_price) || 75; }
    function vipDate(iso) { return new Date(iso).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }); }
    function mk(parent, tag, cls, text) {
        const n = document.createElement(tag); n.className = cls;
        if (text != null) n.textContent = text;
        parent.appendChild(n); return n;
    }

    function renderShop(w) {
        const status = document.getElementById('shop-status');
        status.textContent = w === undefined ? 'недоступен' : w === null ? 'войдите' : w.vip_active ? 'до ' + vipDate(w.vip_until) : 'не активен';
        document.getElementById('shop-buy').textContent = (w && w.vip_active ? 'Продлить' : 'Купить') + ' · ' + vipPrice(w) + ' 🍪';
    }

    function renderShopModal() {
        const w = C.get();
        shopBody.textContent = '';
        document.getElementById('shop-title').textContent = shopMode === 'info' ? 'VIP-статус' : 'Купить VIP';

        if (shopMode === 'info') {
            mk(shopBody, 'p', 'modal-text', 'Что даёт VIP на 30 дней:');
            const ul = mk(shopBody, 'ul', 'modal-list');
            mk(ul, 'li', '', 'доступ к 3D-конфигуратору ПК');
            mk(ul, 'li', '', '3 печеньки в день вместо 1');
            mk(shopBody, 'p', 'modal-hint', 'Стоимость: ' + vipPrice(w) + ' 🍪. Повторная покупка продлевает VIP ещё на 30 дней.');
            mk(shopBody, 'p', 'modal-hint', 'Печеньку можно забрать раз в сутки: новый день начинается в 12:00 по Москве.');
            return;
        }
        if (w === undefined) { mk(shopBody, 'p', 'modal-text', 'Не удалось загрузить данные. Обновите страницу.'); return; }
        if (w === null) {
            const d = mk(shopBody, 'div', 'modal-need-login', '🔒 Чтобы купить VIP, нужно войти в аккаунт.');
            d.appendChild(document.createElement('br'));
            const a = mk(d, 'a', '', 'Войти'); a.href = 'login.html?next=index.html';
            return;
        }
        const p = vipPrice(w);
        const line = mk(shopBody, 'p', 'modal-text', 'VIP на ' + (w.vip_days || 30) + ' дней за ' + p + ' 🍪. У вас ' + w.cookies + ' 🍪.');
        if (w.vip_active) mk(shopBody, 'p', 'modal-hint', 'Сейчас VIP до ' + vipDate(w.vip_until) + ', покупка продлит его на 30 дней.');
        if (w.cookies < p) mk(shopBody, 'p', 'modal-hint', 'Не хватает ' + (p - w.cookies) + ' 🍪.');
        const btn = mk(shopBody, 'button', 'modal-send', 'Купить за ' + p + ' 🍪');
        btn.type = 'button'; btn.disabled = w.cookies < p;
        const msg = mk(shopBody, 'div', 'modal-msg');
        msg.setAttribute('role', 'status');
        btn.addEventListener('click', async function () {
            btn.disabled = true; msg.className = 'modal-msg'; msg.textContent = 'Покупаю…';
            try {
                const nw = await C.buyVip();
                line.textContent = 'У вас осталось ' + nw.cookies + ' 🍪.';
                msg.className = 'modal-msg ok'; msg.textContent = 'Готово! VIP активен до ' + vipDate(nw.vip_until) + '.';
            } catch (e) {
                btn.disabled = false; msg.className = 'modal-msg err'; msg.textContent = C.ruError(e);
            }
        });
    }

    function openShop(mode, trigger) {
        shopMode = mode; shopTrigger = trigger;
        setPanel(false); closeSuggest();
        shopOverlay.classList.add('open');
        renderShopModal();
    }
    function closeShop() {
        if (!shopOverlay.classList.contains('open')) return;
        shopOverlay.classList.remove('open');
        if (shopTrigger) shopTrigger.focus();
    }

    if (!C) {
        shop.hidden = true;
    } else {
        C.mountCounter();
        C.onChange(renderShop);
        C.refresh();
        document.getElementById('shop-info').addEventListener('click', function (e) { e.stopPropagation(); openShop('info', e.currentTarget); });
        document.getElementById('shop-buy').addEventListener('click', function (e) { e.stopPropagation(); openShop('buy', e.currentTarget); });
        document.getElementById('shop-close').addEventListener('click', closeShop);
        shopOverlay.addEventListener('click', function (e) { if (e.target === shopOverlay) closeShop(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeShop(); });
    }

    /* ---------- ПЛАВНЫЙ ПЕРЕХОД МЕЖДУ СТРАНИЦАМИ ---------- */
    document.querySelectorAll('a.btn-style, a.reviews-btn').forEach(function (link) {
        link.addEventListener('click', function (e) {
            // Не мешаем открытию в новой вкладке (Ctrl/Cmd/Shift + клик, средняя кнопка)
            if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            e.preventDefault();
            setPanel(false);
            root.classList.add('leaving');
            const href = link.getAttribute('href');
            setTimeout(function () { window.location.href = href; }, reduceMotion ? 0 : 450);
        });
    });
    // Если пользователь вернулся кнопкой «Назад», убираем состояние ухода
    window.addEventListener('pageshow', function (e) {
        if (e.persisted) root.classList.remove('leaving');
    });

    /* ---------- ЗАЩИТА ОТ F12 (косметическая) ---------- */
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('keydown', function (e) {
        const k = e.key.toLowerCase();
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j')) || (e.ctrlKey && k === 'u')) {
            e.preventDefault();
        }
    });

    /* ---------- НЕОНОВЫЙ ШЛЕЙФ ЗА МЫШКОЙ ---------- */
    if (!reduceMotion) {
        const colorsList = ['#a855f7', '#06b6d4', '#f59e0b'];
        let lastX = 0, lastY = 0, ticking = false;

        function spawnDot(x, y) {
            const dot = document.createElement('div');
            dot.className = 'magic-dot';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            const color = colorsList[Math.floor(Math.random() * colorsList.length)];
            dot.style.backgroundColor = color;
            dot.style.boxShadow = '0 0 8px ' + color + ', 0 0 16px ' + color;
            document.body.appendChild(dot);
            // Удаляем элемент сразу после окончания анимации
            dot.addEventListener('animationend', function () { dot.remove(); });
        }

        // Не чаще одного кружка за кадр, чтобы страница не лагала
        document.addEventListener('mousemove', function (e) {
            lastX = e.clientX;
            lastY = e.clientY;
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(function () {
                    spawnDot(lastX, lastY);
                    ticking = false;
                });
            }
        });
    }
})();
</script>
