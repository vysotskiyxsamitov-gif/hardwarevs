<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardwareVS — Регистрация</title>
<script>try{var t=localStorage.getItem("hardwarevs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"] {
    --bg: #08090b; --text: #ededef;
    --panel-bg: rgba(16, 17, 20, 0.82); --panel-border: rgba(255, 255, 255, 0.09);
    --panel-text: #e4e5e8; --panel-muted: #8a8f98; --option-bg: rgba(255, 255, 255, 0.05);
    --accent: #6f7dff; --acc-rgb: 111, 125, 255;
    --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.16);
    --surface: rgba(255, 255, 255, 0.025); --surface-hover: rgba(255, 255, 255, 0.06);
    --vig: 8, 9, 11; --grid: rgba(255, 255, 255, 0.045);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f4f6; --text: #0f1014;
    --panel-bg: rgba(255, 255, 255, 0.88); --panel-border: rgba(15, 16, 20, 0.12);
    --panel-text: #1a1c22; --panel-muted: #666b76; --option-bg: rgba(15, 16, 20, 0.05);
    --accent: #4f5ce0; --acc-rgb: 79, 92, 224;
    --line: rgba(15, 16, 20, 0.1); --line-strong: rgba(15, 16, 20, 0.2);
    --surface: rgba(255, 255, 255, 0.55); --surface-hover: rgba(255, 255, 255, 0.95);
    --vig: 244, 244, 246; --grid: rgba(15, 16, 20, 0.06);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color .4s ease, color .4s ease; }
  body { min-height: 100vh; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }

  .bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(var(--acc-rgb), .16), transparent 70%); }
  .hero-grid { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px; background-position: center top;
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 72%); }
  .hero-vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(var(--vig), 0) 40%, rgba(var(--vig), .9) 100%),
                linear-gradient(to top, rgba(var(--vig), .95) 0%, rgba(var(--vig), 0) 24%),
                linear-gradient(to bottom, rgba(var(--vig), .9) 0%, rgba(var(--vig), 0) 14%); }

  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 40; display: flex; align-items: center; padding: 0 24px;
    background: rgba(var(--vig), .55); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 22px; fill: none; stroke: var(--text); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .brand:hover svg { transform: rotate(120deg) scale(1.08); }
  .brand b { color: var(--panel-muted); font-weight: 700; }
  .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }

  .theme-btn { position: fixed; top: 11px; right: 20px; z-index: 50; width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: var(--surface); color: var(--panel-muted); border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .2s, color .2s, background-color .2s; }
  .theme-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .theme-btn:hover { border-color: var(--line-strong); color: var(--text); background: var(--surface-hover); transform: translateY(-2px); }
  .theme-btn:active { transform: scale(.93); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 92px 20px 40px; animation: pageIn .8s ease backwards; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } }

  .eyebrow { margin-bottom: 14px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--panel-muted); }
  .eyebrow::before { content: '— '; opacity: .5; }

  .card { position: relative; width: 100%; max-width: 400px; padding: 26px 24px 22px; overflow: hidden;
    background: var(--panel-bg); border: 1px solid var(--line-strong); border-radius: 14px; color: var(--panel-text);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
  .card::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); }
  .card h2 { margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: -.03em; color: var(--text); }
  .sub { margin: 0 0 18px; font-size: 13px; line-height: 1.55; color: var(--panel-muted); }

  label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--panel-muted); }
  input { width: 100%; padding: 12px; border-radius: 8px; background: var(--option-bg); color: var(--panel-text); border: 1px solid var(--panel-border); font: inherit; font-size: 14px; transition: border-color .2s, background-color .2s; }
  input:hover { border-color: var(--line-strong); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--acc-rgb), .18); }

  .btn { width: 100%; margin-top: 20px; padding: 12px 0; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    transition: transform .2s ease, box-shadow .25s, opacity .2s; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px -8px var(--accent); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; border: 1px solid; }
  .msg[hidden] { display: none; }
  .msg.err { color: #f87171; background: rgba(248, 113, 113, .08); border-color: rgba(248, 113, 113, .3); }
  .msg.ok { color: #4ade80; background: rgba(74, 222, 128, .08); border-color: rgba(74, 222, 128, .3); }

  .row { display: flex; justify-content: space-between; margin-top: 16px; font-size: 13px; }
  .row a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .back { margin-top: 18px; display: inline-flex; padding: 6px 13px; border: 1px solid var(--line-strong); border-radius: 99px; background: var(--surface);
    color: var(--panel-muted); text-decoration: none; font-size: 12px; transition: transform .3s ease, border-color .3s, color .3s; }
  .back:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--text); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  @media (max-width: 480px) { .topbar { padding: 0 16px; } .theme-btn { right: 16px; } .card { padding: 22px 18px 18px; } }
  @media (prefers-reduced-motion: reduce) { .wrap { animation: none; } .back:hover, .theme-btn:hover, .btn:hover { transform: none; } }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="hero-grid"></div>
<div class="hero-vignette"></div>

<header class="topbar">
    <a class="brand" href="index.html" aria-label="HardwareVS">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.5 4.9v9.2L12 21.5l-8.5-4.9V7.4L12 2.5z"/><path d="M12 12l8.5-4.6M12 12L3.5 7.4M12 12v9.5"/></svg>
        <span>Hardware<b>VS</b></span>
    </a>
</header>
<button class="theme-btn" id="theme-btn" type="button" aria-label="Сменить тему" title="Сменить тему">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<main class="wrap">
    <span class="eyebrow mono">Новый аккаунт</span>
    <form class="card" id="form" novalidate>
        <h2>Регистрация</h2>
        <p class="sub">Аккаунт нужен, чтобы сохранять свои сборки ПК. Это бесплатно.</p>
        <label for="email">Почта</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Пароль (от 8 символов)</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="password2">Повторите пароль</label>
        <input id="password2" type="password" autocomplete="new-password" required>
        <button class="btn" id="submit" type="submit">Создать аккаунт</button>
        <div class="msg" id="msg" role="alert" hidden></div>
        <div class="row">
            <span></span>
            <a id="toLogin" href="login.html">Уже есть аккаунт? Войти</a>
        </div>
    </form>
    <a class="back mono" href="index.html">← На главную</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
(function () {
    /* тема */
    var root = document.documentElement;
    document.getElementById('theme-btn').addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('hardwarevs-theme', next); } catch (e) {}
    });

    /* регистрация */
    var A = window.HW_AUTH, $ = function (id) { return document.getElementById(id); };
    var msg = $('msg'), btn = $('submit');
    function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.hidden = false; }
    if (!A) { show('Не удалось загрузить сервис входа. Проверьте интернет и обновите страницу.'); btn.disabled = true; return; }

    var q = location.search; if (q) $('toLogin').href = 'login.html' + q;
    A.getUser().then(function (u) { if (u) location.replace(A.safeNext()); });

    $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = $('email').value.trim(), p1 = $('password').value, p2 = $('password2').value;
        if (!email) { show('Введите почту.'); return; }
        if (p1.length < 8) { show('Пароль должен быть не короче 8 символов.'); return; }
        if (p1 !== p2) { show('Пароли не совпадают.'); return; }
        btn.disabled = true; msg.hidden = true;
        A.client.auth.signUp({ email: email, password: p1, options: { emailRedirectTo: A.base + 'login.html' } }).then(function (r) {
            if (r.error) { show(A.ruError(r.error)); btn.disabled = false; return; }
            if (r.data && r.data.session) { location.href = A.safeNext(); return; }   // подтверждение почты выключено
            if (r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0) {
                show('Эта почта уже зарегистрирована. Попробуйте войти.'); btn.disabled = false; return;
            }
            show('Готово! Мы отправили письмо со ссылкой подтверждения. Откройте его, а потом войдите.', true);
            $('form').reset();
        }).catch(function (err) { show(A.ruError(err)); btn.disabled = false; });
    });
})();
</script>
</body>
</html>
