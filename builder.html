<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — 3D-конфигуратор ПК</title>

    <!-- Тема применяется до отрисовки (тот же ключ, что и на главной) -->
    <script>
        try {
            var savedTheme = localStorage.getItem('hardwarevs-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        } catch (e) {}
    </script>

    <!-- 3D-библиотека -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="auth.js"></script>
    <script src="cookies.js"></script>

    <style>
        :root, :root[data-theme="dark"] {
            --bg: #06020b; --panel: #0e0820; --card: #150d33; --card-hover: #1c1245;
            --border: #2e1a53; --border-strong: #442a7a; --text: #ffffff; --muted: #9aa0a6;
            --accent: #a855f7; --accent-2: #06b6d4; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171;
            --glass: rgba(14, 8, 32, 0.82); color-scheme: dark;
        }
        :root[data-theme="light"] {
            --bg: #f3f0fa; --panel: #ffffff; --card: #f1ecfb; --card-hover: #e7defa;
            --border: #ddd2f3; --border-strong: #cbb8ee; --text: #1b1233; --muted: #6b6485;
            --accent: #7c3aed; --accent-2: #0891b2; --ok: #16a34a; --warn: #b45309; --bad: #dc2626;
            --glass: rgba(255, 255, 255, 0.85); color-scheme: light;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
            transition: background-color .4s ease, color .4s ease; }

        .app { display: grid; grid-template-columns: 410px 1fr; height: 100vh; height: 100dvh;
            animation: pageIn .6s ease backwards; transition: opacity .4s ease, filter .4s ease; }
        @keyframes pageIn { from { opacity: 0; filter: blur(6px); } }
        html.leaving .app { opacity: 0; filter: blur(8px); }

        /* ---------- ЛЕВАЯ ПАНЕЛЬ ---------- */
        .sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--panel);
            border-right: 1px solid var(--border); transition: background-color .4s ease; }
        .sb-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
        .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 13px; margin-bottom: 8px; }
        .back:hover { color: var(--accent); }
        .sb-head h1 { font-size: 22px; font-weight: 800; letter-spacing: .5px;
            background: linear-gradient(90deg, #a855f7, #06b6d4, #f59e0b); -webkit-background-clip: text;
            background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .scroll { flex: 1; overflow-y: auto; padding: 16px 18px 8px; min-height: 0; }

        .stepper { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-bottom: 16px; }
        .chip { position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
            background: var(--card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
            font-size: 18px; color: var(--text); transition: border-color .2s, background-color .2s, box-shadow .2s; }
        .chip:hover:not(:disabled) { border-color: var(--accent); }
        .chip:disabled { opacity: .35; cursor: not-allowed; }
        .chip.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(168,85,247,.45); }
        .chip.done::after { content: '✓'; position: absolute; top: -5px; right: -5px; width: 16px; height: 16px;
            border-radius: 50%; background: var(--ok); color: #fff; font-size: 10px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; }
        .chip:focus-visible, .opt:focus-visible, .tb-btn:focus-visible, .gear-btn:focus-visible,
        .theme-option:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .eyebrow { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
        .step-head h2 { font-size: 24px; margin: 2px 0 4px; }
        .step-head p { font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 12px; }

        .options { display: flex; flex-direction: column; gap: 8px; }
        .opt { text-align: left; width: 100%; padding: 12px 14px; background: var(--card); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
            transition: border-color .2s, background-color .2s, transform .2s, box-shadow .2s; }
        .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--card-hover); transform: translateY(-1px); }
        .opt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 16px rgba(168,85,247,.3); }
        .opt:disabled { opacity: .55; cursor: not-allowed; }
        .opt-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        .opt-name { font-weight: 700; font-size: 14px; }
        .opt-price { font-size: 13px; color: var(--accent-2); font-weight: 600; white-space: nowrap; }
        .opt-spec { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .opt-note { font-size: 12px; margin-top: 6px; }
        .opt-note.bad { color: var(--bad); } .opt-note.warn { color: var(--warn); } .opt-note.ok { color: var(--ok); }

        .filters { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .filters input[type="search"] { flex: 1 1 150px; min-width: 0; padding: 9px 12px; background: var(--card); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; }
        .filters input[type="search"]:focus { border-color: var(--accent); }
        .only-ok { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
        .only-ok input { accent-color: var(--accent); }
        .opt-count { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
        .empty-opts { padding: 18px 12px; text-align: center; color: var(--muted); font-size: 13px; }
        .banner { padding: 12px 14px; border: 1px solid var(--ok); border-radius: 10px; margin-bottom: 12px;
            background: rgba(34,197,94,.08); font-size: 13px; line-height: 1.45; }
        .banner b { color: var(--ok); }
        .banner .btn { margin-top: 10px; }
        .banner.warn { border-color: var(--warn); background: rgba(245,158,11,.08); }
        .banner.warn b { color: var(--warn); }

        details.build { margin: 16px 0 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
        details.build summary { cursor: pointer; padding: 11px 14px; font-size: 13px; font-weight: 600; }
        .build-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 14px;
            border-top: 1px solid var(--border); font-size: 12px; }
        .build-row span:first-child { color: var(--muted); } .build-row span:last-child { text-align: right; }

        .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px;
            border-top: 1px solid var(--border); background: var(--panel); }
        .total-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
        .total { font-size: 20px; font-weight: 800; }
        .power { font-size: 12px; color: var(--muted); }

        .btn { padding: 10px 16px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--card);
            color: var(--text); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; transition: border-color .2s, box-shadow .2s, background-color .2s; }
        .btn:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(168,85,247,.3); }
        .btn.primary { background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%); border-color: #a855f7; color: #fff; }

        /* ---------- 3D-ОБЛАСТЬ ---------- */
        .viewport { position: relative; min-height: 0; min-width: 0; overflow: hidden; }
        #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
        #canvas:active { cursor: grabbing; }
        .empty-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            pointer-events: none; text-align: center; padding: 20px; color: var(--muted); font-size: 16px; }
        .empty-hint[hidden] { display: none; }
        .toolbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px;
            flex-wrap: wrap; justify-content: center; padding: 6px; background: var(--glass); border: 1px solid var(--border);
            border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: calc(100% - 24px); }
        .tb-btn { padding: 8px 12px; border-radius: 6px; border: 1px solid transparent; background: var(--card);
            color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: border-color .2s, background-color .2s; }
        .tb-btn:hover { border-color: var(--accent); }
        .tb-btn[aria-pressed="true"] { background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%); color: #fff; border-color: #a855f7; }
        .light-panel { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: min(320px, calc(100vw - 24px));
            padding: 12px; background: var(--glass); border: 1px solid var(--border-strong); border-radius: 10px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
        .light-panel[hidden] { display: none; }
        .lp-title { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .lp-swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
        .lp-sw { aspect-ratio: 1 / 1; border-radius: 50%; border: 2px solid var(--border-strong); cursor: pointer; padding: 0; transition: transform .15s, box-shadow .15s; }
        .lp-sw:hover { transform: scale(1.1); }
        .lp-sw[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--accent), 0 0 12px var(--accent); }
        .lp-sw:focus-visible, .lp-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .lp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; margin-top: 8px; }
        .lp-row input[type="color"] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--border-strong); border-radius: 6px; background: none; cursor: pointer; }
        .lp-row input[type="range"] { flex: 1; max-width: 170px; accent-color: var(--accent); }
        .toast { position: absolute; top: 16px; left: 50%; transform: translate(-50%, -12px); max-width: 80%;
            padding: 10px 16px; border-radius: 8px; background: var(--glass); border: 1px solid var(--warn);
            font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; text-align: center; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* Шестерёнка и выбор темы */
        .settings { position: absolute; top: 16px; right: 16px; z-index: 20; }
        .gear-btn { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            background: var(--glass); color: var(--text); border: 1px solid var(--border-strong); border-radius: 50%;
            cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: border-color .2s, box-shadow .2s; }
        .gear-btn svg { width: 21px; height: 21px; transition: transform .6s ease; }
        .gear-btn:hover { border-color: var(--accent); box-shadow: 0 0 14px rgba(168,85,247,.4); }
        .gear-btn:hover svg { transform: rotate(60deg); }
        .gear-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
        .settings-panel { position: absolute; top: 52px; right: 0; width: 220px; padding: 14px; background: var(--glass);
            border: 1px solid var(--border-strong); border-radius: 10px; backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); box-shadow: 0 12px 30px rgba(0,0,0,.35); opacity: 0; visibility: hidden;
            transform: translateY(-8px) scale(.97); transform-origin: top right;
            transition: opacity .25s ease, transform .25s ease, visibility .25s; }
        .settings-panel.open { opacity: 1; visibility: visible; transform: none; }
        .settings-title { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--muted); margin-bottom: 10px; }
        .theme-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .theme-option { padding: 10px 0; background: var(--card); color: var(--text); border: 1px solid transparent;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .theme-option:hover { border-color: var(--accent); }
        .theme-option[aria-pressed="true"] { background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%);
            border-color: #a855f7; color: #fff; }


        /* ---------- АККАУНТ И СОХРАНЁННЫЕ СБОРКИ ---------- */
        .save-row { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
        .save-row[hidden] { display: none; }
        .save-row .btn { padding: 8px 12px; }
        .who { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: var(--muted); }
        .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
        .who button { background: none; border: 0; padding: 2px; cursor: pointer; font: inherit; font-weight: 600; color: var(--accent); }
        .who button:hover { text-decoration: underline; }
        .who button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
        .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .55); }
        .modal[hidden] { display: none; }
        .m-card { width: 100%; max-width: 460px; max-height: 85vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border-strong);
            border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
        .m-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .m-head h3 { font-size: 17px; }
        .m-x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
        .m-x:hover { color: var(--accent); }
        .m-body { padding: 16px 18px; overflow-y: auto; }
        .m-input { width: 100%; padding: 10px 12px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        .m-input:focus { border-color: var(--accent); }
        .m-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .m-msg { margin-top: 10px; font-size: 13px; color: var(--bad); min-height: 16px; }
        .m-muted { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }
        .b-item { padding: 10px 12px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
        .b-name { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
        .b-meta { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
        .b-item .m-actions { margin-top: 0; }
        .b-item .btn { padding: 7px 12px; }
        .btn.danger:hover { border-color: var(--bad); box-shadow: 0 0 12px rgba(248, 113, 113, .3); color: var(--bad); }

        /* ---------- МОБИЛЬНАЯ ВЕРСТКА ---------- */
        @media (max-width: 860px) {
            .app { grid-template-columns: 1fr; grid-template-rows: 46dvh 1fr; }
            .viewport { order: -1; }
            .sidebar { border-right: 0; border-top: 1px solid var(--border); }
            .toolbar { bottom: 8px; }
            .tb-btn { padding: 6px 9px; font-size: 11px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .app { animation: none; }
        }

        /* Закрытый доступ: только VIP */
        .vip-gate { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); }
        .vip-gate[hidden] { display: none; }
        .vip-card { width: 100%; max-width: 380px; padding: 28px 22px; text-align: center; background: var(--panel); border: 1px solid var(--border-strong); border-radius: 14px; }
        .vip-card h2 { font-size: 22px; margin: 8px 0; }
        .vip-card p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
        .vip-actions { display: flex; flex-direction: column; gap: 8px; }
        .vip-btn { display: block; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; color: #fff; background: linear-gradient(135deg, #f59e0b, #b45309); }
        .vip-btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 600; }
        .vip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ===== ЛЕВАЯ ПАНЕЛЬ ===== -->
    <aside class="sidebar">
        <div class="sb-head">
            <a class="back" id="back-link" href="https://vysotskiyxsamitov-gif.github.io/hardwarevs/index.html">← На главную</a>
            <h1>3D-конфигуратор ПК</h1>
        </div>

        <div class="scroll" id="scroll">
            <div class="stepper" id="stepper"></div>
            <div class="step-head" id="stepHead"></div>
            <div id="banner"></div>
            <div class="filters">
                <input type="search" id="optSearch" placeholder="Поиск по названию…" aria-label="Поиск по названию" autocomplete="off">
                <label class="only-ok"><input type="checkbox" id="onlyOk" checked> Только совместимые</label>
            </div>
            <div class="opt-count" id="optCount"></div>
            <div class="options" id="options"></div>
            <details class="build" id="buildBox">
                <summary>Состав сборки</summary>
                <div id="buildList"></div>
            </details>
        </div>

        <div class="save-row" id="saveRow" hidden>
            <button class="btn" id="saveBtn" type="button">💾 Сохранить</button>
            <button class="btn" id="myBuildsBtn" type="button">📂 Мои сборки</button>
            <div class="who"><span id="whoMail">Не вошли</span><button id="authBtn" type="button">Войти</button></div>
        </div>

        <div class="footer">
            <div>
                <div class="total-label">Итого</div>
                <div class="total" id="total">0 ₽</div>
                <div class="power" id="power"></div>
            </div>
            <button class="btn" id="resetBtn" type="button">Сбросить</button>
        </div>
    </aside>

    <!-- ===== 3D-ОБЛАСТЬ ===== -->
    <main class="viewport" id="viewport">
        <canvas id="canvas"></canvas>
        <div class="empty-hint" id="emptyHint">Выберите корпус слева, чтобы начать сборку</div>
        <div class="toast" id="toast" role="status"></div>

        <div class="toolbar" role="toolbar" aria-label="Управление моделью">
            <button class="tb-btn" id="tbRotate" type="button" aria-pressed="true">↻ Покачивание</button>
            <button class="tb-btn" id="tbGlass" type="button" aria-pressed="false">◻ Стекло</button>
            <button class="tb-btn" id="tbBack" type="button" aria-pressed="true">▭ Задняя крышка</button>
            <button class="tb-btn" id="tbRgb" type="button" aria-pressed="true">✦ RGB</button>
            <button class="tb-btn" id="tbLight" type="button" aria-expanded="false" aria-controls="lightPanel">🎨 Цвет</button>
            <button class="tb-btn" id="tbCam" type="button">⌖ Камера</button>
            <button class="tb-btn" id="tbShot" type="button">⬇ PNG</button>

            <div class="light-panel" id="lightPanel" role="group" aria-label="Подсветка" hidden>
                <div class="lp-title">Цвет подсветки</div>
                <div class="lp-swatches" id="lpSwatches"></div>
                <label class="lp-row">Свой цвет <input type="color" id="lpCustom" value="#a855f7"></label>
                <label class="lp-row">Яркость <input type="range" id="lpBright" min="0.2" max="2.5" step="0.1" value="1.4"></label>
            </div>
        </div>

        <div class="settings" id="settings">
            <button class="gear-btn" id="gear-btn" type="button" aria-label="Настройки" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel">

/* =====================================================================

   ===================================================================== */
let state = {};
let active = 0;

function requiredPower(s) {
    s = s || state;
    if (!s.cpu || !s.gpu) return null;
    return Math.ceil((s.cpu.tdp + s.gpu.tdp + 150) / 50) * 50;
}

// Возвращает текст причины несовместимости или null
function check(key, o, s) {
    s = s || state;
    const c = s.case, mb = s.mb, cpu = s.cpu;
    switch (key) {
        case 'mb':
            if (c && !c.forms.includes(o.form)) return 'Формат ' + o.form + ' не поместится в этот корпус';
            break;
        case 'cpu':
            if (mb && mb.socket !== o.socket) return 'Сокет ' + o.socket + ' не подходит к плате (' + mb.socket + ')';
            if (c && c.cpuTdpMax && o.tdp > c.cpuTdpMax) return 'Корпус охлаждает процессоры не выше ' + c.cpuTdpMax + ' Вт';
            break;
        case 'cooler':
            if (o.type === 'aio') {
                if (c && !c.radMax) return 'Корпус не поддерживает СЖО';
                if (c && o.rad > c.radMax) return 'Корпус принимает радиатор не больше ' + c.radMax + ' мм';
            }
            else if (c && o.height > c.coolerMax) return 'Высота ' + o.height + ' см больше допустимых ' + c.coolerMax + ' см';
            if (cpu && cpu.tdp > o.tdpMax) return 'Не справится с процессором на ' + cpu.tdp + ' Вт';
            break;
        case 'ram':
            if (mb && mb.mem !== o.type) return 'Плата поддерживает только ' + mb.mem;
            if (mb && o.n > (mb.form === 'ITX' ? 2 : 4)) return 'В плате только 2 слота памяти';
            break;
        case 'gpu':
            if (c && o.len > c.gpuMax) return 'Длина ' + o.len + ' см больше допустимых ' + c.gpuMax + ' см';
            if (c && o.thick > c.thickMax) return 'Толщина ' + o.thick + ' см больше допустимых ' + c.thickMax + ' см';
            break;
        case 'fig': {
            if (!s.gpu) return 'Сначала выберите видеокарту';
            const w = window.HW_CK;
            if (w && typeof w.cookies === 'number' && w.cookies < o.cookies) return 'Нужно ' + o.cookies + ' 🍪, у вас ' + w.cookies;
            break;
        }
        case 'psu': {
            const r = requiredPower(s);
            if (r && o.watt < r) return 'Не хватает мощности: нужно от ' + r + ' Вт';
            break;
        }
    }
    return null;
}

    return removed;
}

let backOn = true, autoRotate = true, glassOn = false, rgbOn = true, dragging = false;
let rgbColor = null, rgbHex = null, rgbBright = 1.4;   // rgbColor = null — радуга, иначе однотонный цвет
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function caseDims() { return state.case ? state.case.dims : { x: 46, y: 45, z: 21 }; }

const FIT_REF = 56;   // единый масштаб кадра: большие корпуса занимают больше места, маленькие — меньше
function fitRadius() {
    const D = caseDims();
    const target = Math.max(D.x, D.y) * 1.18;
    const ref = FIT_REF * 1.18;
    // 65% — реальное соотношение размеров, 35% — подгонка под кадр (чтобы мелкий корпус не терялся)
    const span = ref * Math.pow(target / ref, 0.65);
    cam.span = cam.span ? cam.span + (span - cam.span) * 0.12 : span;
    return 1.45 * cam.span * Math.max(1, 1 / camera.aspect);
}

function updateCamera(dt) {
    if (autoRotate && !dragging) cam.auto += dt;
    const sway = autoRotate ? Math.sin(cam.auto * 0.5) * 0.6 : 0;
    const k = Math.min(1, dt * 9);
    cam.theta += (cam.base + sway - cam.theta) * k;
    cam.phi += (cam.tPhi - cam.phi) * k;
    cam.zoom += (cam.tZoom - cam.zoom) * Math.min(1, dt * 8);
    const r = fitRadius() * cam.zoom;
    camera.position.set(r * Math.sin(cam.phi) * Math.sin(cam.theta), r * Math.cos(cam.phi), r * Math.sin(cam.phi) * Math.cos(cam.theta));
    camera.lookAt(0, -1, 0);
}

const pointers = new Map();
function pinchDist() {
    const p = Array.from(pointers.values());
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}
canvas.addEventListener('pointerdown', e => {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    dragging = true;
});
canvas.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    const oldDist = pointers.size === 2 ? pinchDist() : 0;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) {
        cam.base -= dx * 0.008;
        cam.tPhi = clamp(cam.tPhi - dy * 0.006, 0.3, 1.75);
    } else if (pointers.size === 2 && oldDist > 0) {
        cam.tZoom = clamp(cam.tZoom * oldDist / pinchDist(), 0.35, 1.6);
    }
});
function endPointer(e) { pointers.delete(e.pointerId); dragging = pointers.size > 0; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
    e.preventDefault();
    cam.tZoom = clamp(cam.tZoom * Math.exp(e.deltaY * 0.001), 0.35, 1.6);
}, { passive: false });

function resize() {

/* =====================================================================
   3D: ПОМОЩНИКИ ДЛЯ ПОСТРОЕНИЯ ДЕТАЛЕЙ
   ===================================================================== */
let CTX = null; // собирает RGB-материалы и вращающиеся вентиляторы текущей детали

function mat(color, o) {
    const q = Object.assign({ color: color, metalness: 0.3, roughness: 0.55 }, o || {});
    if (!q.transparent && !q.alphaMap && q.metalness < 0.6) return new T.MeshPhysicalMaterial(Object.assign({ clearcoat: 0.35, clearcoatRoughness: 0.4 }, q));
    return new T.MeshStandardMaterial(q);
}
const BEV = {};
function bevBox(w, h, d) {   // коробка со скруглёнными рёбрами — ловит блики на гранях
    const mn = Math.min(w, h, d);
    if (mn < 1.0) return new T.BoxGeometry(w, h, d);
    const b = Math.min(0.14, mn * 0.1), key = [w, h, d].join();
    if (BEV[key]) return BEV[key];
    const x = (w - 2 * b) / 2, y = (h - 2 * b) / 2, sh = new T.Shape();
    sh.moveTo(-x, -y); sh.lineTo(x, -y); sh.lineTo(x, y); sh.lineTo(-x, y); sh.lineTo(-x, -y);
    const g = new T.ExtrudeGeometry(sh, { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 1 });
    g.translate(0, 0, -(d - 2 * b) / 2);
    return (BEV[key] = g);
}
function box(w, h, d, color, o) {
    const m = new T.Mesh(bevBox(w, h, d), mat(color, o));
    m.castShadow = true; m.receiveShadow = true;
    return m;
}
function cyl(r, h, color, o, seg) {          // цилиндр, ось вдоль Z
    const m = new T.Mesh(new T.CylinderGeometry(r, r, h, seg || 32), mat(color, o));
    m.rotation.x = Math.PI / 2;
    m.castShadow = true; m.receiveShadow = true;
    return m;
}
function at(obj, x, y, z) { obj.position.set(x, y, z); return obj; }

function rgbMat() {
    const m = new T.MeshStandardMaterial({ color: '#1a1a1f', emissive: new T.Color(0x000000), emissiveIntensity: 1.4, roughness: 0.4 });
    m.userData.off = (CTX.rgb.length * 0.11) % 1;
    CTX.rgb.push(m);
    return m;
}

function labelPlane(text, w, h, fg, bg) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = Math.max(32, Math.round(512 * h / w));
    const x = c.getContext('2d');
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
    let fs = c.height * 0.62;
    x.font = 'bold ' + fs + 'px "Segoe UI", Arial, sans-serif';
    while (x.measureText(text).width > c.width * 0.9 && fs > 10) { fs -= 4; x.font = 'bold ' + fs + 'px "Segoe UI", Arial, sans-serif'; }
    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(text, c.width / 2, c.height / 2 + 2);
    const tex = new T.CanvasTexture(c);
    const m = new T.Mesh(new T.PlaneGeometry(w, h),
        new T.MeshBasicMaterial({ map: tex, transparent: true, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
    return m;
}

function tube(pts, r, color) {
    const curve = new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], p[1], p[2])));
    const m = new T.Mesh(new T.TubeGeometry(curve, 48, r, 8, false), mat(color, { roughness: 0.8, metalness: 0.1 }));
    m.castShadow = true;
    return m;
}

// Вентилятор: смотрит вдоль +Z, толщина th, центр в начале координат
function fan(size, th) {
    th = th || 2.5;
    const g = new T.Group(), fc = '#16141f', b = 0.5;
    g.add(at(box(size, b, th, fc), 0, size / 2 - b / 2, 0));
    g.add(at(box(size, b, th, fc), 0, -(size / 2 - b / 2), 0));
    g.add(at(box(b, size - 2 * b, th, fc), size / 2 - b / 2, 0, 0));
    g.add(at(box(b, size - 2 * b, th, fc), -(size / 2 - b / 2), 0, 0));
    g.add(cyl(size * 0.17, th * 0.9, '#0c0b12'));
    const blades = new T.Group();
    for (let i = 0; i < 9; i++) {
        const arm = new T.Group();
        arm.rotation.z = i / 9 * Math.PI * 2;
        const bl = box(size * 0.33, size * 0.15, 0.12, '#25222f');
        bl.position.x = size * 0.27;
        bl.rotation.x = 0.55;
        arm.add(bl);
        blades.add(arm);
    }
    g.add(blades);
    g.add(at(cyl(size * 0.09, th * 0.95, '#2e2b3a', { metalness: 0.7 }), 0, 0, th * 0.03));
    [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(k => g.add(at(cyl(0.22, th * 0.95, '#6b6f7a', { metalness: 0.9 }), k[0] * (size / 2 - 0.9), k[1] * (size / 2 - 0.9), 0)));
    CTX.spin.push({ o: blades, sp: 7 });
    const ring = new T.Mesh(new T.TorusGeometry(size * 0.455, 0.1, 8, 48), rgbMat());
    ring.position.z = th / 2 - 0.2;
    g.add(ring);
    return g;
}

/* =====================================================================
   3D: РАСКЛАДКА ВНУТРИ КОРПУСА
   Система координат: начало — задний нижний угол у задней стенки (материнская
   «тарелка» в плоскости z=0), X — от задней стенки к передней, Y — вверх,
   Z — в сторону открытой боковины (на зрителя).
   ===================================================================== */
function layoutNow() {
    const c = state.case, mb = state.mb;

    const gltf = loadModel(gpu.model);

    const s = gpu.len / 4.89, H = G.z1 - G.z0, m = gltf.scene.clone(true);
    m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.material = o.material.clone(); } });

    g.add(m);
    const fans = [];
    m.traverse(o => { if (FAN_NODES[o.name.replace(/[^A-Za-z0-9]/g, '')]) fans.push(o); });
    fans.filter(o => fans.indexOf(o.parent) === -1).forEach(node => {
        const proxy = { rotation: { _z: 0, get z() { return this._z; }, set z(v) { node.rotateY(v - this._z); this._z = v; } } };

    g.add(at(box(0.3, gpu.thick + 0.5, H + 0.5, '#b8bcc6', { metalness: 0.8, roughness: 0.3 }), G.x0 - 0.15, gy, G.z0 + H / 2));

}

        for (let i = 0; i < 6; i++) g.add(at(box(0.2, 0.9, 1.3, '#08080c'), B.x1 + 0.05, B.y0 + 1.2 + i * Math.min(1.5, (ph - 2) / 6), cz));
        g.add(at(box(0.3, 2.4, 3.2, '#0a0a0e'), B.x0 - 0.1, cy, cz));
        [3.2, 4.4, 5.6].forEach(r => g.add(at(new T.Mesh(new T.TorusGeometry(r, 0.14, 8, 48), mat('#2a2a34', { metalness: 0.6 })), cx, cy, B.z0 - 0.06)));   // решётка вентилятора БП
        if (L) { // кабели: часть идёт за лотком и видна при снятой задней крышке
            const D = L.D, zs = L.zs, K = '#0b0b10', yc = L.top - L.bh * 0.55, xr = L.bx + L.bw;
            const cable = (pts, r, col) => g.add(tube(pts, r || 0.42, col || K));
            const grom = (x, y) => { g.add(at(new T.Mesh(new T.TorusGeometry(1.5, 0.3, 8, 24), mat('#07070a', { roughness: 0.9 })), x, y, 0.12)); g.add(at(cyl(1.3, 0.08, '#030305'), x, y, 0.04)); };

            const h2 = [Math.min(xr + 1.8, D.x - 2.5), yc], h3 = [L.bx + L.bw * 0.15, Math.min(L.top + 1.8, D.y - 1.8)], hx = B.x1 + 2.5;
            [h2, h3].forEach(h => grom(h[0], h[1]));
            const p24 = [[B.x1 + 0.1, 4.5, cz], [hx, 5, -3.2], [(hx + h2[0]) / 2, (5 + h2[1] - 4) / 2, -2.4], [h2[0], h2[1] - 4, -2.4], [h2[0], h2[1], -1.4], [h2[0], h2[1], 1.0], [(h2[0] + xr - 0.9) / 2, yc, zs + 2.6], [xr - 0.9, yc, zs + 1.5]];
            [-1, 1].forEach(d => cable(p24.map(q => [q[0], q[1] + d * 0.8, q[2]]), 0.5));        // 24-pin лентой
            const p8 = [[B.x1 + 0.1, 7.2, cz], [hx, 7.6, -3.4], [hx + 0.2, (7.6 + h3[1] - 4) / 2, -2.8], [(hx + h3[0]) / 2, h3[1] - 4, -2.8], [h3[0], h3[1] - 4, -2.8], [h3[0], h3[1], -1.4], [h3[0], h3[1], 1.0], [h3[0], (h3[1] + L.top - 0.7) / 2, zs + 2.4], [h3[0], L.top - 0.7, zs + 1.5]];
            [-1, 1].forEach(d => cable(p8.map(q => [q[0] + d * 0.5, q[1], q[2]]), 0.42));        // CPU 8-pin
            strap(h2[0], h2[1] - 4.5, 2.6, 0.8); strap(h3[0], h3[1] - 4.5, 2.2, 0.8);

                const hg = [Math.min(cx + 2.5, D.x - 2.5), Math.max(2.5, G.y0 - 3.2)];
                grom(hg[0], hg[1]);
                [-0.4, 0.4].forEach(d => cable([[B.x1 + 0.1, 3.6 + d, cz], [hx, 3.8 + d, -3.4], [(hx + hg[0]) / 2, (3.8 + hg[1]) / 2 + d, -2.2], [hg[0], hg[1] + d, -1.4], [hg[0], hg[1] + d, 1.0], [hg[0], hg[1] + d, G.z1 * 0.55], [hg[0], hg[1] + d, G.z1 + 1.3], [cx + 1.0, (hg[1] + gy) / 2 + d, G.z1 + 1.3], [cx, gy + d, G.z1 + 0.2]], 0.42));
            }
            const hdr = i => [L.bx + L.bw * (0.3 + 0.1 * i), L.top - L.bh + 0.5];       // разъёмы вентиляторов на плате
            state.case.fronts.slice(0, 3).forEach((y, i) => { const h = hdr(i); cable([[D.x - 2.6, y - 6, D.z / 2], [D.x - 3.5, Math.max(3, y - 9), D.z / 2 - 3], [h[0] + 1, h[1] + 3, zs + 4], [h[0], h[1], zs + 0.9]], 0.17); });
            const hr = hdr(0); cable([[2.4, D.y - 13.4, D.z - 6.5], [2.6, D.y - 17, zs + 4], [hr[0] - 1, hr[1] + 3, zs + 3], [hr[0], hr[1], zs + 0.9]], 0.17);   // задний вентилятор
            if (state.cooler && state.cooler.type === 'aio') { const h = hdr(1); cable([[L.cpu.x + 3.6, L.cpu.y - 1, zs + 4], [L.cpu.x + 6, L.cpu.y - 4, zs + 3], [h[0], h[1] + 2, zs + 2], [h[0], h[1], zs + 0.9]], 0.17); }
        }
        return g;
    }
};

// От чего зависит деталь: req — обязательные, opt — влияют на геометрию (кабели)
const PARTSPEC = {
    case:   { req: ['case'] },
    mb:     { req: ['case', 'mb'] },
    cpu:    { req: ['case', 'mb', 'cpu'] },
    cooler: { req: ['case', 'mb', 'cpu', 'cooler'] },
    ram:    { req: ['case', 'mb', 'ram'] },
    gpu:    { req: ['case', 'mb', 'gpu'] },
    ssd:    { req: ['case', 'mb', 'ssd'] },
    psu:    { req: ['case', 'psu'], opt: ['mb', 'gpu', 'cooler'] },
    fig:    { req: ['case', 'mb', 'gpu', 'fig'] }
};
const OFFS = {
    case:   new T.Vector3(0, 16, 0),  mb:  new T.Vector3(0, 0, 18),  cpu:  new T.Vector3(0, 0, 16),
    cooler: new T.Vector3(0, 0, 20),  ram: new T.Vector3(0, 12, 10), gpu:  new T.Vector3(14, 0, 8),
    ssd:    new T.Vector3(0, 0, 12),  psu: new T.Vector3(-16, 0, 0), fig: new T.Vector3(0, 14, 0)
};

/* =====================================================================
   3D: УПРАВЛЕНИЕ ДЕТАЛЯМИ В СЦЕНЕ (появление, удаление, синхронизация)
   ===================================================================== */
const parts = {};   // key -> { key, group }

function buildPart(key) {
    CTX = { rgb: [], spin: [] };
    const g = BUILDERS[key]();
    g.userData.rgb = CTX.rgb;
    g.userData.spin = CTX.spin;
    CTX = null;
    return g;
}
function eachMat(obj, fn) {
    obj.traverse(o => {
        if (!o.material) return;
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(fn);
    });
}
function disposePart(g) {
    rig.remove(g);
    g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    eachMat(g, m => { if (m.map) m.map.dispose(); m.dispose(); });
}
function startAnim(g, off, delay) {
    g.userData.anim = { t0: performance.now() + delay, off: off, dur: reduceMotion ? 1 : 750 };
    g.position.copy(off);
    eachMat(g, m => {
        if (m.userData.o === undefined) { m.userData.o = m.opacity; m.userData.tr = m.transparent; }
        m.transparent = true; m.opacity = 0;
    });
}
function stepAnims(now) {
    for (const key in parts) {
        const g = parts[key].group, a = g.userData.anim;
        if (!a) continue;
        const t = clamp((now - a.t0) / a.dur, 0, 1), e = 1 - Math.pow(1 - t, 3);
        g.position.set(a.off.x * (1 - e), a.off.y * (1 - e), a.off.z * (1 - e));
        eachMat(g, m => { m.opacity = m.userData.o * e; });
        if (t >= 1) {
            eachMat(g, m => { m.opacity = m.userData.o; m.transparent = m.userData.tr; });
            g.position.set(0, 0, 0);
            delete g.userData.anim;
        }
    }
}
function wantKey(key) {
    const sp = PARTSPEC[key];
    if (!sp.req.every(k => state[k])) return null;
    return sp.req.concat(sp.opt || []).map(k => state[k] ? state[k].id : '-').join('|');
}
function sync() {
    let delay = 0;
    STEPS.forEach(step => {
        const key = step.key, want = wantKey(key), have = parts[key];
        if (have && have.key === want) return;
        if (have) { disposePart(have.group); delete parts[key]; }
        if (want) {
            const g = buildPart(key);
            rig.add(g);
            parts[key] = { key: want, group: g };
            startAnim(g, OFFS[key], delay);
            delay += 130;
        }
    });
    const D = caseDims();
    rig.position.set(-D.x / 2, -D.y / 2, -D.z / 2);
    floor.position.y = -D.y / 2 - 0.5;
    applyGlass();
    $('emptyHint').hidden = !!state.case;
}
const PANEL_BTN = { solid: 'Панель', mesh: 'Сетка' };
function applyGlass() {
    if (parts.case && parts.case.group.userData.back) parts.case.group.userData.back.visible = backOn;
    if (parts.case && parts.case.group.userData.glass) parts.case.group.userData.glass.visible = glassOn;
    $('tbGlass').textContent = '◻ ' + ((state.case && PANEL_BTN[state.case.panel]) || 'Стекло');
}

/* =====================================================================
   ЦИКЛ ОТРИСОВКИ
   ===================================================================== */
let lastT = performance.now();
function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    stepAnims(now);
    for (const key in parts) {
        const ud = parts[key].group.userData;
        ud.spin.forEach(s => { s.o.rotation.z += dt * s.sp; });
        ud.rgb.forEach(m => {
            if (!rgbOn) m.emissive.setRGB(0, 0, 0);
            else if (rgbColor) m.emissive.copy(rgbColor);
            else m.emissive.setHSL((now * 0.0001 + m.userData.off) % 1, 1, 0.5);
            m.emissiveIntensity = rgbBright;
        });
    }
    updateCamera(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
}

const stepperEl = $('stepper'), headEl = $('stepHead'), optionsEl = $('options'), bannerEl = $('banner');
let advanceTimer = null;

function stepHint(key) {
    switch (key) {
        case 'case': return 'Корпус определяет, какие платы, кулеры и видеокарты поместятся.';
        case 'mb':   return state.case ? 'Корпус поддерживает форматы: ' + state.case.forms.join(', ') + '.' : '';
        case 'cpu':  return state.mb ? 'Сокет платы: ' + state.mb.socket + '.' : '';
        case 'cooler': return state.cpu ? 'Тепловыделение процессора: ' + state.cpu.tdp + ' Вт.' : '';
        case 'ram':  return state.mb ? 'Плата поддерживает память ' + state.mb.mem + '.' : '';
        case 'gpu':  return state.case ? 'Максимальная длина видеокарты в корпусе: ' + state.case.gpuMax + ' см.' : '';
        case 'ssd':  return 'Накопитель M.2 NVMe устанавливается в слот на плате.';
        case 'fig':  return 'Фигурка стоит на видеокарте. Это декор, цена указана в печеньках 🍪.';
        case 'psu': { const r = requiredPower(); return r ? 'Рекомендуемая мощность — от ' + r + ' Вт.' : ''; }
    }
    return '';
}

function renderStepper() {
    const fm = firstMissing(), reach = fm === -1 ? STEPS.length - 1 : fm;
    stepperEl.innerHTML = STEPS.map((s, i) => {
        const done = !!state[s.key];
        return '<button class="chip' + (i === active ? ' active' : '') + (done ? ' done' : '') + '" data-i="' + i + '"' +
            (i > reach ? ' disabled' : '') + ' title="' + s.title + '" aria-label="Шаг ' + (i + 1) + ': ' + s.title + '">' + s.icon + '</button>';
    }).join('');
}

let filterText = '', onlyOk = true;

function renderOptions() {
    const step = STEPS[active], key = step.key;
    headEl.innerHTML = '<div class="eyebrow">Шаг ' + (active + 1) + ' из ' + STEPS.length + '</div><h2>' + step.title + '</h2><p>' + stepHint(key) + '</p>';

    const all = DATA[key].map(o => ({ o: o, reason: check(key, o), sel: !!(state[key] && state[key].id === o.id) }));
    const anyOk = all.some(x => !x.reason);
    const q = filterText.trim().toLowerCase();
    let list = all.filter(x => (!q || x.o.name.toLowerCase().includes(q)) && (!onlyOk || !x.reason || x.sel));
    list = list.filter(x => !x.reason).concat(list.filter(x => x.reason));   // совместимые — выше

    optionsEl.innerHTML = list.length ? list.map(x => {
        const o = x.o, reason = x.reason, sel = x.sel;
        let note = '';
        if (reason) note = '<div class="opt-note bad">✕ ' + reason + '</div>';
        else if (sel) note = '<div class="opt-note ok">✓ Установлено</div>';
        else if (state[key]) {
            const sim = Object.assign({}, state); sim[key] = o;
            const removed = revalidate(sim);
            if (removed.length) note = '<div class="opt-note warn">⚠ Будет убрано: ' + removed.join(', ') + '</div>';
        }
        return '<button class="opt' + (sel ? ' sel' : '') + '" data-id="' + o.id + '"' + (reason ? ' disabled' : '') + '>' +
            '<div class="opt-top"><span class="opt-name">' + o.name + '</span><span class="opt-price">' + priceTxt(o) + '</span></div>' +
            '<div class="opt-spec">' + specOf(key, o) + '</div>' + note + '</button>';
    }).join('') : '<div class="empty-opts">Ничего не найдено. Измените поиск или снимите «Только совместимые».</div>';
    $('optCount').textContent = 'Показано ' + list.length + ' из ' + all.length;

    let banner = '';
    if (!anyOk) {
        banner = '<div class="banner warn"><b>Нет подходящих вариантов.</b> Вернитесь на предыдущие шаги и выберите другие компоненты.</div>';
    } else if (firstMissing() === -1) {
        banner = '<div class="banner"><b>✅ Сборка готова!</b> Крутите модель мышью, включайте стекло и RGB. Любой шаг можно изменить — несовместимые детали уберутся сами.' +
            '<div><button class="btn primary" type="button" id="bannerShot">Сохранить картинку</button></div></div>';
    }
    bannerEl.innerHTML = banner;
    const bs = $('bannerShot');
    if (bs) bs.addEventListener('click', saveShot);
}

function setActive(i) {
    active = i;
    filterText = '';

    $('scroll').scrollTop = 0;
}
$('optSearch').addEventListener('input', e => { filterText = e.target.value; renderOptions(); });

function renderSummary() {
    let total = 0, ck = 0, rows = '';
    STEPS.forEach(s => {
        const o = state[s.key];
        if (o) { total += o.price; ck += o.cookies || 0; rows += '<div class="build-row"><span>' + s.title + '</span><span>' + o.name + ' · ' + priceTxt(o) + '</span></div>'; }

}

function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('show'), 3800);
}

function choose(key, id) {
    const o = DATA[key].find(x => x.id === id);
    if (!o || check(key, o)) return;
    clearTimeout(advanceTimer);
    if (!(state[key] && state[key].id === id)) {
        state[key] = o;
        const removed = revalidate(state);
        sync();
        if (removed.length) toast('Убрано как несовместимое: ' + removed.join(', '));
    }
    render();
    const fm = firstMissing();
    if (fm !== -1) advanceTimer = setTimeout(() => setActive(fm), 550);
}

stepperEl.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b || b.disabled) return;
    clearTimeout(advanceTimer);
    setActive(+b.dataset.i);
});
optionsEl.addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (b && !b.disabled) choose(STEPS[active].key, b.dataset.id);
});
$('resetBtn').addEventListener('click', () => {
    if (!Object.keys(state).length) return;
    if (!window.confirm('Сбросить всю сборку?')) return;

    sync(); setActive(0);
});

const AUTH = window.HW_AUTH;
const DRAFT_KEY = 'hardwarevs-draft';
let user = null, currentBuild = null;   // currentBuild = { id, name } открытая сохранённая сборка

function partsOf() { const p = {}; STEPS.forEach(s => { if (state[s.key]) p[s.key] = state[s.key].id; }); return p; }
function totalOf() { return STEPS.reduce((t, s) => t + (state[s.key] ? state[s.key].price : 0), 0); }

// Подставляет сохранённый состав: что пропало из каталога или стало несовместимым, убирается
function applyParts(parts) {
    const s = {}; let lost = 0;
    STEPS.forEach(st => {
        const id = parts && parts[st.key];
        if (!id) return;
        const o = DATA[st.key].find(x => x.id === id);
        if (o) s[st.key] = o; else lost++;
    });
    const removed = revalidate(s);
    clearTimeout(advanceTimer);
    state = s;
    sync();
    const fm = firstMissing();
    setActive(fm === -1 ? 0 : fm);
    if (removed.length || lost) toast('Часть деталей недоступна или несовместима и была убрана');
}

const modal = $('modal'), modalBody = $('modalBody');

    window.location.href = 'login.html?next=builder.html';
}

function setUser(u) {

if (AUTH) {
    $('saveRow').hidden = false;
    AUTH.getUser().then(setUser);
    AUTH.client.auth.onAuthStateChange((ev, session) => setUser(session ? session.user : null));

    $('authBtn').addEventListener('click', () => { if (user) AUTH.client.auth.signOut(); else goLogin(); });

    async function doSave(name, asNew, msgEl, btns) {
        name = (name || '').trim().slice(0, 80) || 'Моя сборка';
        const row = { name: name, parts: partsOf(), total_price: totalOf() };
        btns.forEach(b => { b.disabled = true; });
        try {
            const q = AUTH.client.from('builds');
            const res = (currentBuild && !asNew)
                ? await q.update(row).eq('id', currentBuild.id).select('id,name').single()
                : await q.insert(row).select('id,name').single();
            if (res.error) throw res.error;
            currentBuild = { id: res.data.id, name: res.data.name };
            closeModal();
            toast('Сборка сохранена');
        } catch (err) {
            msgEl.textContent = 'Не удалось сохранить: ' + (err && err.message ? err.message : 'ошибка сети');
            btns.forEach(b => { b.disabled = false; });
        }
    }

    $('saveBtn').addEventListener('click', () => {
        if (!user) { goLogin(); return; }
        if (!state.case) { toast('Сначала выберите хотя бы корпус'); return; }
        openModal('Сохранить сборку');
        const input = el('input', 'm-input'); input.type = 'text'; input.maxLength = 80;
        input.placeholder = 'Название сборки';
        input.value = currentBuild ? currentBuild.name : 'Моя сборка';
        const msg = el('div', 'm-msg'); msg.setAttribute('role', 'alert');
        const actions = el('div', 'm-actions');
        const main = el('button', 'btn primary', currentBuild ? 'Обновить' : 'Сохранить'); main.type = 'button';
        const btns = [main];
        actions.appendChild(main);
        main.addEventListener('click', () => doSave(input.value, false, msg, btns));
        if (currentBuild) {
            const copy = el('button', 'btn', 'Сохранить как новую'); copy.type = 'button';
            btns.push(copy); actions.appendChild(copy);
            copy.addEventListener('click', () => doSave(input.value, true, msg, btns));
        }
        input.addEventListener('keydown', e => { if (e.key === 'Enter') main.click(); });
        modalBody.appendChild(input); modalBody.appendChild(actions); modalBody.appendChild(msg);
        input.focus(); input.select();
    });

    $('myBuildsBtn').addEventListener('click', async () => {
        if (!user) { goLogin(); return; }
        openModal('Мои сборки');
        modalBody.appendChild(el('div', 'm-muted', 'Загрузка…'));
        const res = await AUTH.client.from('builds').select('id,name,parts,total_price,created_at').order('created_at', { ascending: false }).limit(50);
        modalBody.textContent = '';
        if (res.error) { modalBody.appendChild(el('div', 'm-msg', 'Не удалось загрузить: ' + res.error.message)); return; }
        if (!res.data.length) { modalBody.appendChild(el('div', 'm-muted', 'Пока нет сохранённых сборок.')); return; }
        res.data.forEach(bld => {
            const item = el('div', 'b-item');
            item.appendChild(el('div', 'b-name', bld.name));
            item.appendChild(el('div', 'b-meta', (bld.total_price != null ? fmt(bld.total_price) + ' · ' : '') + dateStr(bld.created_at)));
            const act = el('div', 'm-actions');
            const open = el('button', 'btn primary', 'Открыть'); open.type = 'button';
            const del = el('button', 'btn danger', 'Удалить'); del.type = 'button';
            open.addEventListener('click', () => {
                applyParts(bld.parts);
                currentBuild = { id: bld.id, name: bld.name };
                closeModal();
            });
            del.addEventListener('click', async () => {
                if (!window.confirm('Удалить сборку «' + bld.name + '»?')) return;
                del.disabled = true;
                const r = await AUTH.client.from('builds').delete().eq('id', bld.id);
                if (r.error) { del.disabled = false; toast('Не удалось удалить: ' + r.error.message); return; }
                if (currentBuild && currentBuild.id === bld.id) currentBuild = null;
                item.remove();
                if (!modalBody.children.length) modalBody.appendChild(el('div', 'm-muted', 'Пока нет сохранённых сборок.'));
            });
            act.appendChild(open); act.appendChild(del); item.appendChild(act);
            modalBody.appendChild(item);
        });
    });
}

/* ---------- Старт ---------- */
applyTheme(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
resize();
sync();
render();
// Вернулись со страницы входа: восстанавливаем сборку, которую собирали до этого
try {
    const d = sessionStorage.getItem(DRAFT_KEY);
    if (d) {
        sessionStorage.removeItem(DRAFT_KEY);
        const p = JSON.parse(d);
        if (p && typeof p === 'object' && Object.keys(p).length) applyParts(p);
    }
} catch (e) {}
requestAnimationFrame(frame);

})();
</script>
<script>
(function () {
    const gate = document.getElementById('vipGate'), text = document.getElementById('vipGateText'), box = document.getElementById('vipGateActions');
    const C = window.HW_COOKIES;
    function show(msg, links) {
        text.textContent = msg; box.textContent = '';
        links.forEach(function (l) {
            const a = document.createElement('a');
            a.href = l.href; a.className = 'vip-btn' + (l.ghost ? ' ghost' : ''); a.textContent = l.label;
            box.appendChild(a);
        });
        gate.hidden = false;
    }
    const HOME = { href: 'index.html', label: '← На главную', ghost: true };
    // Если проверить VIP нельзя, доступ остаётся закрытым
    if (!C) { show('Не удалось проверить VIP-статус. Обновите страницу.', [HOME]); return; }
    C.onChange(function (w) {
        window.HW_CK = w || null; try { window.dispatchEvent(new Event('hw-cookies')); } catch (e) {}
        if (w === undefined) show('Не удалось проверить VIP-статус. Обновите страницу.', [HOME]);
        else if (w === null) show('Конфигуратор доступен только с VIP. Войдите в аккаунт, чтобы продолжить.', [
            { href: 'login.html?next=builder.html', label: 'Войти' }, { href: 'register.html?next=builder.html', label: 'Регистрация', ghost: true }, HOME]);
        else if (!w.vip_active) show('Нужен VIP: ' + w.vip_price + ' 🍪 на ' + w.vip_days + ' дней. У вас ' + w.cookies + ' 🍪.', [{ href: 'index.html', label: 'Перейти в магазин' }]);
        else gate.hidden = true;
    });
    C.refresh();
})();
</script>
