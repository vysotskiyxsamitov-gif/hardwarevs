<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardwareVS — 3D-конфигуратор ПК</title>
<style>body{margin:0;background:#06020b;color:#9aa0a6;font-family:Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body>
<div id="msg">Загрузка конфигуратора…</div>
<script>
(function () {
    var SRC = 'builder-src.html';   // твой прежний builder.html, переименованный

    var PATCHES = [
        {
            name: 'кожух БП',
            find: "P(D.x * 0.45, 0.12, D.z * 0.7, '#0a0a0d', D.x * 0.45, 0.1, D.z * 0.5);",
            add: `
        {
            const SH = Math.min(9.5, D.y * 0.2), SW = Math.min(D.x * 0.52, 26), SZ = D.z - 1.4;
            const sc = new T.Group();
            sc.add(at(box(SW, SH, SZ, body, mo), 0.4 + SW / 2, 0.4 + SH / 2, 0.8 + SZ / 2));
            for (let i = 0; i < 7; i++)
                sc.add(at(box(SW * 0.45, 0.1, 0.35, '#050507'), 0.4 + SW * 0.55, SH + 0.45, 3 + i * (SZ - 5) / 6));
            const lbl = labelPlane('PSU', 5, 1.8, '#d1d5db');
            lbl.rotation.y = Math.PI / 2;
            sc.add(at(lbl, 0.4 + SW + 0.02, SH * 0.5, D.z * 0.5));
            sc.add(at(box(0.15, SH * 0.55, 3.2, '#050507'), 0.4 + SW + 0.05, SH * 0.5, D.z - 4.5));
            g.add(sc);
        }`,
            keep: true
        },
        {
            name: 'порты видеокарты',
            find: "for (let i = 0; i < 4; i++) Q(0.12, th * 0.16, H * 0.3, '#050507', G.x0 - 0.35, G.y0 + th * (0.2 + i * 0.2), G.z0 + H / 2);",
            add: `for (let i = 0; i < 4; i++) {
            const hy = G.y0 + th * (0.2 + i * 0.2), hdmi = i === 0;
            Q(0.3, th * 0.14, H * 0.3, hdmi ? '#3a3a46' : '#2a2a34', G.x0 - 0.35, hy, G.z0 + H / 2, { metalness: 0.8 });
            Q(0.34, th * 0.08, H * 0.22, '#030305', G.x0 - 0.38, hy, G.z0 + H / 2);
            Q(0.2, th * 0.03, H * 0.16, hdmi ? '#9aa1ad' : '#15151b', G.x0 - 0.42, hy, G.z0 + H / 2, { metalness: 0.9 });
        }`
        },
        {
            name: 'порты GLB-видеокарты',
            find: "for (let i = 0; i < 4; i++) g.add(at(box(0.12, gpu.thick * 0.16, H * 0.3, '#050507'), G.x0 - 0.35, G.y0 + gpu.thick * (0.2 + i * 0.2), G.z0 + H / 2));",
            add: `for (let i = 0; i < 4; i++) {
        const hy = G.y0 + gpu.thick * (0.2 + i * 0.2), hdmi = i === 0, cz = G.z0 + H / 2;
        g.add(at(box(0.3, gpu.thick * 0.14, H * 0.3, hdmi ? '#3a3a46' : '#2a2a34', { metalness: 0.8 }), G.x0 - 0.35, hy, cz));
        g.add(at(box(0.34, gpu.thick * 0.08, H * 0.22, '#030305'), G.x0 - 0.38, hy, cz));
        g.add(at(box(0.2, gpu.thick * 0.03, H * 0.16, hdmi ? '#9aa1ad' : '#15151b', { metalness: 0.9 }), G.x0 - 0.42, hy, cz));
    }`
        }
    ];

    fetch(SRC + '?v=' + Date.now()).then(function (r) {
        if (!r.ok) throw new Error('Не найден файл ' + SRC);
        return r.text();
    }).then(function (src) {
        var failed = [];
        PATCHES.forEach(function (p) {
            var parts = src.split(p.find);
            if (parts.length !== 2) { failed.push(p.name); return; }
            src = parts[0] + (p.keep ? p.find : '') + p.add + parts[1];
        });
        if (failed.length) console.warn('Правки не применены: ' + failed.join(', '));
        document.open();
        document.write(src);
        document.close();
    }).catch(function (e) {
        document.getElementById('msg').textContent = 'Ошибка загрузки: ' + e.message;
    });
})();
</script>
</body>
</html>
