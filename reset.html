<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardwareVS — Новый пароль</title>
<script>try{var t=localStorage.getItem("hardwarevs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="wrap">
    <a class="logo" href="index.html">HardwareVS</a>
    <form class="card" id="form" novalidate>
        <h2>Новый пароль</h2>
        <p class="sub" id="sub">Проверяем ссылку из письма…</p>
        <div id="fields" hidden>
            <label for="password">Новый пароль (от 8 символов)</label>
            <input id="password" type="password" autocomplete="new-password" minlength="8" required>
            <label for="password2">Повторите пароль</label>
            <input id="password2" type="password" autocomplete="new-password" required>
            <button class="btn" id="submit" type="submit">Сохранить пароль</button>
        </div>
        <div class="msg" id="msg" role="alert" hidden></div>
        <div class="row"><span></span><a href="login.html">Ко входу</a></div>
    </form>
    <a class="back" href="index.html">← На главную</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
(function () {
    var A = window.HW_AUTH, $ = function (id) { return document.getElementById(id); };
    var msg = $('msg'), btn = $('submit'), ready = false;
    function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.hidden = false; }
    if (!A) { $('sub').textContent = ''; show('Не удалось загрузить сервис входа. Обновите страницу.'); return; }

    function open() { if (ready) return; ready = true; $('sub').textContent = 'Придумайте новый пароль для своего аккаунта.'; $('fields').hidden = false; }
    A.client.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') open(); });
    setTimeout(function () {
        if (ready) return;
        A.getUser().then(function (u) {
            if (u) open();
            else { $('sub').textContent = ''; show('Ссылка недействительна или устарела. Запросите новую на странице входа.'); }
        });
    }, 1800);

    $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var p1 = $('password').value, p2 = $('password2').value;
        if (p1.length < 8) { show('Пароль должен быть не короче 8 символов.'); return; }
        if (p1 !== p2) { show('Пароли не совпадают.'); return; }
        btn.disabled = true; msg.hidden = true;
        A.client.auth.updateUser({ password: p1 }).then(function (r) {
            if (r.error) { show(A.ruError(r.error)); btn.disabled = false; return; }
            show('Пароль изменён. Перенаправляем на главную…', true);
            setTimeout(function () { location.href = 'index.html'; }, 1500);
        }).catch(function (err) { show(A.ruError(err)); btn.disabled = false; });
    });
})();
</script>
</body>
</html>
