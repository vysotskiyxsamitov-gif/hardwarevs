<html lang="ru">

    <style>

            --bg-color: #0b0813;
            --card-bg: #140e28;
            --accent-purple: #8a2be2;
            --neon-glow: #bf55ec;
            --text-color: #e2daf8;
            --bar-color-1: #2f81f7;
            --bar-color-2: #e55350;
            --bar-color-3: #3fb950;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
        }
        .back-link { align-self: flex-start; color: #bfaee3; text-decoration: none; font-weight: bold; font-size: 1.1rem; transition: color 0.2s; margin-bottom: 20px; }
        .back-link:hover { color: var(--neon-glow); }
        .header { text-align: center; margin-bottom: 35px; }
        .header h1 { 
            font-size: 2.6rem; margin: 0; font-weight: 900; 
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;
        }
        .compare-container {
            background-color: var(--card-bg); border: 1px solid #302654; border-radius: 16px;
            padding: 30px; max-width: 650px; width: 100%; box-shadow: 0 12px 32px rgba(0,0,0,0.6); box-sizing: border-box;
        }
        .select-group { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: start; margin-bottom: 24px; }
        .vs-label { font-weight: bold; color: #8b949e; font-size: 1.2rem; margin-top: 14px; text-align: center; }
        
        .search-select-box { position: relative; width: 100%; }
        .select-trigger {
            background-color: #211a3d; color: var(--text-color); border: 1px solid #302654;
            border-radius: 8px; padding: 14px; font-size: 1rem; cursor: pointer; text-align: left;
            user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: border-color 0.2s;
        }
        .search-select-box.active .select-trigger { border-color: var(--neon-glow); }
        .select-dropdown {
            position: absolute; top: 105%; left: 0; width: 100%; background-color: #1a1331;
            border: 1px solid #4a3b7d; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            display: none; flex-direction: column; z-index: 100; max-height: 300px; box-sizing: border-box;
        }
        .search-select-box.active .select-dropdown { display: flex; }
        .search-input {
            background-color: #0b0813; color: #fff; border: none; border-bottom: 1px solid #302654;
            padding: 12px; font-size: 0.95rem; outline: none; border-radius: 8px 8px 0 0; box-sizing: border-box; width: 100%;
        }
        .search-input:focus { border-bottom-color: var(--neon-glow); }
        .options-list { overflow-y: auto; max-height: 240px; margin: 0; padding: 0; list-style: none; }
        .option-item { padding: 12px; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e2daf8; }
        .option-item:hover { background-color: var(--accent-purple); color: #fff; }
        .option-item.no-results { color: #8b949e; cursor: default; background: none !important; }

        .compare-btn {
            width: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--neon-glow)); color: #fff;
            border: none; border-radius: 8px; padding: 16px; font-size: 1.15rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 14px rgba(138, 43, 226, 0.4); transition: transform 0.1s ease, filter 0.2s; margin-top: 10px;
        }
        .compare-btn:hover { filter: brightness(1.1); }
        .compare-btn:active { transform: scale(0.98); }
        .results { margin-top: 35px; display: none; }
        .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #fff; border-bottom: 1px solid #302654; padding-bottom: 8px; }
        .result-item { margin-bottom: 24px; }
        .cpu-name-label { font-size: 0.95rem; color: #bfaee3; margin-bottom: 6px; }
        .bar-container { background-color: #1a1331; border-radius: 8px; height: 28px; overflow: hidden; border: 1px solid #302654; position: relative; }
        .bar {
            height: 100%; width: 0%; transition: width 1.2s cubic-bezier(0.1, 1, 0.1, 1); 
            display: flex; align-items: center; padding-left: 12px; font-size: 0.95rem; font-weight: bold; color: #fff; box-sizing: border-box;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .bar-cores { background: linear-gradient(90deg, #1f6feb, var(--bar-color-1)); }
        .bar-watt { background: linear-gradient(90deg, #e55350, var(--bar-color-2)); }
        .bar-power { background: linear-gradient(90deg, #2ea043, var(--bar-color-3)); }
        .summary { margin-top: 30px; padding: 18px; background-color: rgba(138, 43, 226, 0.1); border-left: 4px solid var(--accent-purple); border-radius: 0 8px 8px 0; font-size: 1.1rem; line-height: 1.5; }
        @media (max-width: 500px) { .select-group { grid-template-columns: 1fr; justify-items: center; gap: 5px; } .vs-label { margin: 5px 0; } }
    </style>
</head>

        let selectedIndex1 = null;
        let selectedIndex2 = null;

        function setupSearchSelect(boxId, triggerId, searchId, listId, isFirstSelect) {
            const box = document.getElementById(boxId);
            const trigger = document.getElementById(triggerId);
            const searchInput = document.getElementById(searchId);
            const list = document.getElementById(listId);

            function renderList(filterText = "") {
                list.innerHTML = "";
                let count = 0;
                
                cpuDatabase.forEach((cpu, index) => {
                    if (cpu.name.toLowerCase().includes(filterText.toLowerCase())) {
                        const li = document.createElement('li');
                        li.className = 'option-item';
                        li.textContent = cpu.name;
                        li.addEventListener('click', (e) => {
                            e.stopPropagation();
                            trigger.textContent = cpu.name;
                            if (isFirstSelect) selectedIndex1 = index; else selectedIndex2 = index;
                            box.classList.remove('active');
                        });
                        list.appendChild(li);
                        count++;
                    }
                });

                if (count === 0) {
                    const li = document.createElement('li');
                    li.className = 'option-item no-results';
                    li.textContent = 'Ничего не найдено';
                    list.appendChild(li);
                }
            }

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.search-select-box').forEach(b => {
                    if(b.id !== boxId) b.classList.remove('active');
                });
                box.classList.toggle('active');
                if (box.classList.contains('active')) {
                    searchInput.value = "";
                    renderList("");
                    searchInput.focus();
                }
            });

            searchInput.addEventListener('input', (e) => {
                renderList(e.target.value);
            });
        }

        setupSearchSelect('box1', 'trigger1', 'search1', 'list1', true);
        setupSearchSelect('box2', 'trigger2', 'search2', 'list2', false);

        document.addEventListener('click', () => {
            document.querySelectorAll('.search-select-box').forEach(b => b.classList.remove('active'));
        });

        function compareCPUs() {
            if (selectedIndex1 === null || selectedIndex2 === null) {
                alert('Пожалуйста, выберите оба процессора из списков!');
                return;
            }

            const proc1 = cpuDatabase[selectedIndex1];
            const proc2 = cpuDatabase[selectedIndex2];

            document.getElementById('coresName1').innerText = proc1.name;
            document.getElementById('coresName2').innerText = proc2.name;
            document.getElementById('wattName1').innerText = proc1.name;
            document.getElementById('wattName2').innerText = proc2.name;
            document.getElementById('powerName1').innerText = proc1.name;
            document.getElementById('powerName2').innerText = proc2.name;

            const maxCores = Math.max(proc1.cores, proc2.cores, 1);
            const maxWatt = Math.max(proc1.watt, proc2.watt, 1);
            const maxScore = Math.max(proc1.score, proc2.score, 1);

            document.getElementById('resultsBlock').style.display = 'block';

            setTimeout(() => {
                const bCores1 = document.getElementById('barCores1'); const bCores2 = document.getElementById('barCores2');
                bCores1.style.width = (proc1.cores / maxCores * 100) + '%'; bCores1.innerText = proc1.text;
                bCores2.style.width = (proc2.cores / maxCores * 100) + '%'; bCores2.innerText = proc2.text;

                const bWatt1 = document.getElementById('barWatt1'); const bWatt2 = document.getElementById('barWatt2');
                bWatt1.style.width = (proc1.watt / maxWatt * 100) + '%'; bWatt1.innerText = proc1.watt + ' W';
                bWatt2.style.width = (proc2.watt / maxWatt * 100) + '%'; bWatt2.innerText = proc2.watt + ' W';

                const bPower1 = document.getElementById('barPower1'); const bPower2 = document.getElementById('barPower2');
                bPower1.style.width = (proc1.score / maxScore * 100) + '%'; bPower1.innerText = proc1.score + ' pts';
                bPower2.style.width = (proc2.score / maxScore * 100) + '%'; bPower2.innerText = proc2.score + ' pts';
            }, 50);

            function getBallWord(num) {
                let n = Math.abs(num) % 100; if (n >= 5 && n <= 20) return 'баллов';
                n %= 10; if (n === 1) return 'балл'; if (n >= 2 && n <= 4) return 'балла'; return 'баллов';
            }

            const diff = Math.abs(proc1.score - proc2.score);
            let text = '';
            if (proc1.score > proc2.score) {
                text = `Процессор <strong>${proc1.name}</strong> мощнее в тестах ровно на <strong>${diff}</strong> ${getBallWord(diff)}!`;
            } else if (proc2.score > proc1.score) {
                text = `Процессор <strong>${proc2.name}</strong> мощнее в тестах ровно на <strong>${diff}</strong> ${getBallWord(diff)}!`;
            } else {
                text = `Обе модели процессоров имеют абсолютно одинаковую общую производительность!`;
            }
            document.getElementById('summaryText').innerHTML = text;
        }
