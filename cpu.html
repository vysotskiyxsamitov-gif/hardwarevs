<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardwareVS — Процессоры</title>
<script>try{var t=localStorage.getItem('hardwarevs-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="dark"]{--bg:#08090b;--text:#ededef;--muted:#8a8f98;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--surface:rgba(255,255,255,.03);--hover:rgba(255,255,255,.07);--vig:8,9,11;--grid:rgba(255,255,255,.045);--a:#6f7dff;--b:#2fd3b0;--metal1:#3a3f4d;--metal2:#1a1d26;--dd:#14161c;color-scheme:dark}
:root[data-theme="light"]{--bg:#f4f4f6;--text:#0f1014;--muted:#666b76;--line:rgba(15,16,20,.1);--line2:rgba(15,16,20,.2);--surface:rgba(255,255,255,.6);--hover:rgba(15,16,20,.06);--vig:244,244,246;--grid:rgba(15,16,20,.06);--a:#4f5ce0;--b:#0fa88a;--metal1:#d7dbe4;--metal2:#a9afbf;--dd:#fff;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(600px circle at 22% 30%,color-mix(in srgb,var(--a) 18%,transparent),transparent 70%),radial-gradient(600px circle at 78% 30%,color-mix(in srgb,var(--b) 16%,transparent),transparent 70%)}
.bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 35%,#000,transparent 72%)}
.top{position:fixed;top:0;left:0;right:0;height:60px;z-index:40;display:flex;align-items:center;gap:28px;padding:0 24px;background:rgba(var(--vig),.6);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:700;font-size:15px}
.brand b{color:var(--muted)}
.brand svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:1.7;stroke-linejoin:round}
nav{display:flex;gap:4px}
nav a{padding:7px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;transition:.2s}
nav a:hover,nav a.on{color:var(--text);background:var(--hover)}
.sp{flex:1}
.theme{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:16px;transition:.2s}
.theme:hover{color:var(--text);border-color:var(--line2)}
main{position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:92px 20px 50px}
h1{margin:0 0 6px;font-size:clamp(26px,5vw,44px);letter-spacing:-.04em;text-align:center}
.lead{margin:0 auto 26px;text-align:center;color:var(--muted);font-size:14.5px}
.arena{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.side{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.side.a{--c:var(--a)}.side.b{--c:var(--b)}
/* поиск */
.sbox{position:relative;width:100%;max-width:340px;z-index:30}
.trig{width:100%;text-align:left;padding:12px 38px 12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.25s;position:relative}
.trig::after{content:'';position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .25s}
.sbox.open .trig::after{transform:translateY(-30%) rotate(225deg)}
.trig:hover,.sbox.open .trig{border-color:var(--c);box-shadow:0 0 22px -8px var(--c)}
.dd{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:min(300px,88vw);background:var(--dd);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden}
.side.b .dd{left:auto}
.sbox.open .dd{display:flex;animation:ddIn .18s ease}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px)}}
.dd input{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:12px 14px;font:16px Inter,sans-serif;outline:none}
.dd input:focus{border-bottom-color:var(--c)}
.dd ul{list-style:none;margin:0;padding:4px;max-height:260px;overflow-y:auto}
.dd li{padding:9px 10px;border-radius:7px;font-size:13.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd li:hover,.dd li.sel{background:color-mix(in srgb,var(--c) 22%,transparent)}
.dd li.none{color:var(--muted);cursor:default}
/* 3D чип */
.stage{width:100%;height:240px;perspective:800px;display:grid;place-items:center;position:relative}
.chip{position:relative;width:150px;height:150px;transform-style:preserve-3d;will-change:transform}
.chip.swap{animation:sw .5s ease}
@keyframes sw{from{opacity:0}}
.f{position:absolute;backface-visibility:hidden}
.top-f{inset:0;transform:translateZ(8px);border-radius:14px;border:1px solid var(--line2);overflow:hidden;background:linear-gradient(135deg,var(--metal1),var(--metal2) 60%,var(--metal1))}
.top-f::before{content:'';position:absolute;inset:14px;border-radius:8px;border:1px solid var(--c);background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 75%);box-shadow:inset 0 0 22px -4px var(--c),0 0 26px -6px var(--c)}
.top-f::after{content:'';position:absolute;left:5px;top:5px;border:7px solid transparent;border-top-color:var(--c);border-left-color:var(--c);opacity:.8}
.lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:0 24px;line-height:1.5;z-index:2}
.lbl b{display:block;font-size:13px;letter-spacing:.03em;word-break:break-word}
.bot-f{inset:0;transform:translateZ(-8px) rotateY(180deg);border-radius:14px;background:radial-gradient(circle,#c9a24f 2px,transparent 2.5px) 0 0/10px 10px,#2a2418}
.e{background:linear-gradient(var(--metal1),var(--metal2))}
.e.r{width:16px;height:150px;left:67px;top:0;transform:rotateY(90deg) translateZ(75px)}
.e.l{width:16px;height:150px;left:67px;top:0;transform:rotateY(-90deg) translateZ(75px)}
.e.u{width:150px;height:16px;left:0;top:67px;transform:rotateX(90deg) translateZ(75px)}
.e.d{width:150px;height:16px;left:0;top:67px;transform:rotateX(-90deg) translateZ(75px)}
.shadow{position:absolute;bottom:22px;left:50%;width:150px;height:20px;margin-left:-75px;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--c) 50%,transparent),transparent 70%);filter:blur(6px);opacity:.8}
.cores{display:grid;grid-template-columns:repeat(8,10px);gap:5px;min-height:25px;justify-content:center}
.cores i{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 8px -1px var(--c);animation:pop .4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pop{from{transform:scale(0);opacity:0}}
.cap{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;text-align:center;overflow-wrap:anywhere}
.mid{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:60px}
.vs{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;border:1px solid var(--line2);background:var(--surface);position:relative}
.vs::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px dashed var(--line2);animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swapbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;font:500 12px Inter;transition:.2s}
.swapbtn:hover{color:var(--text);border-color:var(--line2)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:10px 0 18px;padding:16px 20px;border:1px solid var(--line2);border-radius:14px;background:rgba(var(--vig),.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.score .n{font-size:clamp(34px,6vw,56px);font-weight:700;letter-spacing:-.04em}
.score .n.a{color:var(--a);text-align:right}.score .n.b{color:var(--b)}
.score .t{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;text-align:center}
.verdict{text-align:center;margin:0 0 20px;font-size:14px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.verdict b{color:var(--text)}
.rows{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:rgba(var(--vig),.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.row{display:grid;grid-template-columns:84px 1fr 120px 1fr 84px;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line);transition:background .25s}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.v{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.v.a{text-align:right;--c:var(--a)}.v.b{--c:var(--b)}
.v.w{color:var(--c)}
.k{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.bar{height:8px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;width:0;border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1);opacity:.5}
.bar.a i{right:0;background:var(--a)}.bar.b i{left:0;background:var(--b)}
.bar.win i{opacity:1}
.foot{margin-top:14px;text-align:center;font-size:11.5px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--text);text-decoration:none;font-size:13px;font-weight:600;transition:.25s;white-space:nowrap}
.back span{display:inline-block;transition:transform .25s}
.back:hover{border-color:var(--a);box-shadow:0 0 22px -8px var(--a);transform:translateX(-2px)}
.back:hover span{transform:translateX(-4px)}
main,.top{transition:opacity .35s,transform .35s,filter .35s}
html.leaving main,html.leaving .top{opacity:0;transform:scale(.985);filter:blur(5px)}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.row{position:relative;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.px{position:fixed;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--a);opacity:0;pointer-events:none;z-index:1;animation:fly linear infinite}
.px:nth-child(even){background:var(--b)}
@keyframes fly{10%{opacity:.7}90%{opacity:.5}100%{transform:translate3d(var(--dx,20px),-105vh,0);opacity:0}}
.ring{position:absolute;left:50%;bottom:-83px;width:230px;height:230px;margin-left:-115px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);animation:ringspin 14s linear infinite;pointer-events:none}
.ring.r2{width:170px;height:170px;margin-left:-85px;bottom:-53px;border-style:solid;opacity:.5;animation-duration:9s;animation-direction:reverse}
@keyframes ringspin{from{transform:rotateX(74deg) rotate(0)}to{transform:rotateX(74deg) rotate(360deg)}}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 12px var(--c);animation:scan 2.8s ease-in-out infinite;z-index:3}
@keyframes scan{0%{top:6%;opacity:0}15%,85%{opacity:1}100%{top:94%;opacity:0}}
.beam{position:absolute;left:16%;right:16%;top:190px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--a),var(--b));opacity:.35;pointer-events:none}
.beam::after{content:'';position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 14px 3px var(--a);animation:travel 2.6s ease-in-out infinite alternate}
@keyframes travel{to{left:calc(100% - 8px);background:var(--b);box-shadow:0 0 14px 3px var(--b)}}
.crown{position:absolute;top:2px;left:50%;translate:-50% 0;z-index:5;padding:4px 11px;border-radius:99px;font-size:10.5px;letter-spacing:.14em;color:#1a1300;background:linear-gradient(90deg,#f3d27a,#d9b25a);box-shadow:0 0 22px -2px rgba(217,178,90,.7);opacity:0;scale:.6;transition:opacity .4s,scale .5s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap}
.side.lead .crown{opacity:1;scale:1}
.side.lead .shadow{opacity:1;filter:blur(9px)}
.side.lead .top-f::before{box-shadow:inset 0 0 30px -2px var(--c),0 0 40px -2px var(--c)}
.vs.hit{animation:vsPop .5s}
.vs.hit::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--text);animation:hit .8s ease-out forwards}
@keyframes vsPop{40%{transform:scale(1.18)}}
@keyframes hit{to{transform:scale(2.2);opacity:0}}
.row::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--a) 14%,transparent),transparent 70%)}
.row:hover::before{opacity:1}
.bar i{overflow:hidden}
.bar.win i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shim 2.4s ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}
.n.pop{animation:npop .5s}
@keyframes npop{40%{transform:scale(1.25)}}

/* ===== телефон: текст не налезает друг на друга ===== */
@media(max-width:820px){
nav{display:none}
main{padding:84px 12px 40px}
.top{gap:12px;padding:0 14px}
.arena{grid-template-columns:1fr 1fr;gap:8px}
.mid,.beam{display:none}
.trig{white-space:normal;font-size:12.5px;line-height:1.25;padding:9px 28px 9px 10px;min-height:46px;display:flex;align-items:center}
.stage{height:190px;zoom:.75}
.lbl{padding:0 20px;font-size:9px;letter-spacing:.06em}
.lbl b{font-size:12px}
.cap{font-size:10px;letter-spacing:.04em}
.cores{grid-template-columns:repeat(8,8px);gap:4px}
.cores i{width:8px;height:8px}
.score{padding:12px;gap:8px}
.score .t{font-size:9px;letter-spacing:.06em}
.verdict{font-size:13px}
.row{grid-template-columns:1fr 1fr;grid-template-areas:"k k" "va vb" "ba bb";gap:6px 12px;padding:12px}
.k{grid-area:k;font-size:10px;letter-spacing:.05em}
.v{font-size:13px}
.v.a{grid-area:va;text-align:left}
.v.b{grid-area:vb;text-align:right}
.bar.a{grid-area:ba}
.bar.b{grid-area:bb}
.bar.a i{right:auto;left:0}
}
@media(max-width:520px){.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

function search(id,key){
 var box=$(id),trig=box.querySelector('.trig'),inp=box.querySelector('input'),ul=box.querySelector('ul');
 function fill(q){
  ul.innerHTML='';q=q.toLowerCase().trim();var n=0;
  DB.forEach(function(d,i){if(d.n.toLowerCase().indexOf(q)<0)return;n++;var li=document.createElement('li');li.textContent=d.n;if(i===sel[key])li.className='sel';

  if(!n){var li=document.createElement('li');li.className='none';li.textContent='Ничего не найдено';ul.appendChild(li)}
 }
 trig.addEventListener('click',function(e){e.stopPropagation();var o=!box.classList.contains('open');
  document.querySelectorAll('.sbox').forEach(function(b){b.classList.remove('open')});
  if(o){box.classList.add('open');inp.value='';fill('');inp.focus();var s=ul.querySelector('.sel');if(s)ul.scrollTop=s.offsetTop-80}});
 inp.addEventListener('input',function(){fill(inp.value)});
 inp.addEventListener('click',function(e){e.stopPropagation()});
 inp.addEventListener('keydown',function(e){if(e.key==='Enter'){var f=ul.querySelector('li:not(.none)');if(f)f.click()}if(e.key==='Escape')box.classList.remove('open')});
}

/* единый плавный цикл: наклон + парение в одном transform */
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var m={x:0,y:0,tx:0,ty:0,sa:0,sb:0},last=performance.now();
addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;m.tx=e.clientX/innerWidth-.5;m.ty=e.clientY/innerHeight-.5},{passive:true});
var chA=$('chA'),chB=$('chB');
function loop(now){
 requestAnimationFrame(loop);
 var dt=Math.min((now-last)/1000,.05);last=now;
 if(document.hidden)return;
 var k=1-Math.exp(-dt*4);
 m.x+=(m.tx-m.x)*k;m.y+=(m.ty-m.y)*k;var sd=Math.exp(-dt*4);m.sa*=sd;m.sb*=sd;
 var bob=reduce?0:Math.sin(now/1100)*6,rx=58-m.y*7,rz=m.x*12;
 chA.style.transform='translate3d(0,'+bob.toFixed(2)+'px,0) rotateX('+rx.toFixed(2)+'deg) rotateZ('+(-28+rz+m.sa).toFixed(2)+'deg)';
 chB.style.transform='translate3d(0,'+(-bob).toFixed(2)+'px,0) rotateX('+rx.toFixed(2)+'deg) rotateZ('+(28+rz+m.sb).toFixed(2)+'deg)';
}

function render(upA,upB){

 $('boxA').querySelector('.trig').textContent=A.n;$('boxB').querySelector('.trig').textContent=B.n;

  if(p[2]){m['s'+p[0].toLowerCase()]=-320;ch.classList.remove('swap');void ch.offsetWidth;ch.classList.add('swap');cores($('co'+p[0]),d.c)}
 });
 ROWS.forEach(function(r,i){
  var a=r[1](A),b=r[1](B),low=r[3],row=rows.children[i],best=low?Math.min(a,b):Math.max(a,b)||1;
  var wA=a!==b&&(low?a<b:a>b),wB=a!==b&&(low?b<a:b>a);
  if(wA)wa++;if(wB)wb++;
  var va=row.querySelector('.v.a'),vb=row.querySelector('.v.b');
  va.textContent=r[2](A);vb.textContent=r[2](B);
  va.classList.toggle('w',wA);vb.classList.toggle('w',wB);
  var ba=row.querySelector('.bar.a'),bb=row.querySelector('.bar.b');
  ba.classList.toggle('win',wA);bb.classList.toggle('win',wB);
  var pa=low?best/a*100:a/best*100,pb=low?best/b*100:b/best*100;
  setTimeout(function(){ba.firstChild.style.width=pa+'%';bb.firstChild.style.width=pb+'%'},40+i*70);
 });
 countTo($('sA'),wa);countTo($('sB'),wb);
 document.querySelector('.side.a').classList.toggle('lead',A.p>B.p);document.querySelector('.side.b').classList.toggle('lead',B.p>A.p);
